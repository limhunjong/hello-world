<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VRR Calculator</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: rgba(255, 255, 255, 0.86);
      --card-solid: #ffffff;
      --border: rgba(0, 0, 0, 0.08);
      --text: #1d1d1f;
      --subtext: #6e6e73;
      --accent: #0a84ff;
      --success: #1f9d55;
      --danger: #d93025;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
      --radius: 24px;
      --radius-sm: 16px;
      --max: 980px;
      --focus: 0 0 0 4px rgba(10, 132, 255, 0.14);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.75), transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .app {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 40px;
    }

    header {
      margin-bottom: 24px;
      padding: 10px 2px 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.25rem);
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .subtitle {
      margin-top: 12px;
      max-width: 58ch;
      color: var(--subtext);
      font-size: clamp(1rem, 1.6vw, 1.1rem);
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 1.4fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-inner {
      padding: 24px;
    }

    .entry-panel {
      position: sticky;
      top: 20px;
    }

    .section-title {
      margin: 0 0 8px;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--subtext);
      text-transform: uppercase;
    }

    .progress,
    .step-note,
    .entered-preview,
    .row-edit-pill,
    .row-edit-hint,
    .hint-line {
      display: none;
    }

    .row-select-wrap {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .row-select-label {
      color: var(--subtext);
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .row-select {
      flex: 1;
      min-width: 0;
      appearance: none;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 14px;
      min-height: 44px;
      padding: 0 14px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
    }

    .row-select:focus-visible {
      box-shadow: var(--focus);
      border-color: rgba(10, 132, 255, 0.45);
    }

    .progress-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.14);
    }

    .prompt {
      margin-top: 6px;
      font-size: 1.1rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .step-note {
      margin-top: 8px;
      color: var(--subtext);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .edit-banner {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(10, 132, 255, 0.08);
      color: var(--accent);
      font-size: 0.92rem;
      line-height: 1.45;
      font-weight: 600;
    }

    .input-wrap {
      margin-top: 18px;
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      height: 66px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
      font-size: clamp(1.12rem, 3.15vw, 1.65rem);
      font-weight: 650;
      letter-spacing: -0.02em;
      text-align: center;
      outline: none;
      padding: 0 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    input[type="text"]::placeholder {
      color: #a1a1a6;
      font-weight: 500;
      opacity: 1;
    }

    input[type="text"]:focus {
      border-color: rgba(10, 132, 255, 0.55);
      box-shadow: var(--focus), inset 0 1px 0 rgba(255, 255, 255, 0.75);
      transform: translateY(-1px);
    }

    .entered-preview {
      margin-top: 14px;
      min-height: 26px;
      color: var(--subtext);
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .error {
      margin-top: 12px;
      min-height: 24px;
      color: var(--danger);
      font-size: 0.95rem;
      line-height: 1.4;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .shake {
      animation: shake 280ms ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .summary-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 14px;
      min-height: 48px;
      padding: 0 18px;
      font: inherit;
      font-weight: 650;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, background-color 140ms ease, opacity 140ms ease;
      user-select: none;
    }

    button:active { transform: scale(0.98); }

    button:disabled {
      opacity: 0.56;
      cursor: default;
      transform: none;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 10px 24px rgba(10, 132, 255, 0.22);
    }

    .btn-secondary {
      background: rgba(0, 0, 0, 0.06);
      color: var(--text);
    }

    .btn-secondary:hover,
    .btn-primary:hover {
      transform: translateY(-1px);
    }

    .btn-secondary:focus-visible,
    .btn-primary:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }

    .results-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .results-title {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .results-subtitle {
      margin: 6px 0 0;
      color: var(--subtext);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .rows {
      display: grid;
      gap: 12px;
    }

    .row-card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 20px;
      padding: 18px 18px 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.04);
      position: relative;
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
    }

    .row-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.06);
    }

    .row-card:focus-within {
      border-color: rgba(10, 132, 255, 0.34);
      box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.10), 0 14px 28px rgba(0, 0, 0, 0.06);
    }

    .row-card.is-editing {
      border-color: rgba(10, 132, 255, 0.34);
      box-shadow: 0 14px 30px rgba(10, 132, 255, 0.10), 0 10px 24px rgba(0, 0, 0, 0.04);
    }

    .row-top {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .row-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .row-label-block {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .row-period-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .row-period-select,
    .row-period-custom {
      appearance: none;
      border: 1px solid rgba(0, 0, 0, 0.09);
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      border-radius: 999px;
      min-height: 34px;
      padding: 0 12px;
      font: inherit;
      font-size: 0.84rem;
      font-weight: 650;
      letter-spacing: -0.01em;
      line-height: 1;
      outline: none;
      transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease, background-color 140ms ease;
    }

    .row-period-select {
      max-width: 180px;
      cursor: pointer;
    }

    .row-period-custom {
      width: min(180px, 42vw);
      cursor: text;
      text-align: left;
    }

    .row-period-select:hover,
    .row-period-custom:hover {
      border-color: rgba(10, 132, 255, 0.22);
      background: rgba(255, 255, 255, 0.98);
    }

    .row-period-select:focus-visible,
    .row-period-custom:focus-visible {
      box-shadow: var(--focus);
      border-color: rgba(10, 132, 255, 0.42);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .row-edit-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(10, 132, 255, 0.10);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      pointer-events: none;
    }

    .row-edit-hint {
      margin-top: 2px;
      color: var(--subtext);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge.neutral {
      background: rgba(0, 0, 0, 0.06);
      color: var(--text);
    }

    .badge.good {
      background: rgba(31, 157, 85, 0.12);
      color: var(--success);
    }

    .badge.bad {
      background: rgba(217, 48, 37, 0.11);
      color: var(--danger);
    }

    .badge.accent {
      background: rgba(10, 132, 255, 0.12);
      color: var(--accent);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 10px 12px;
      align-items: start;
    }

    .metric {
      grid-column: span 4;
      min-width: 0;
    }

    .metric.wide {
      grid-column: span 12;
    }

    .metric .kicker {
      color: var(--subtext);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .metric .value {
      font-size: clamp(1rem, 1.9vw, 1.12rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.35;
      word-break: break-word;
    }

    .size-inline {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .size-chip {
      appearance: none;
      border: 1px solid rgba(10, 132, 255, 0.18);
      background: rgba(10, 132, 255, 0.06);
      color: var(--text);
      border-radius: 999px;
      min-height: 34px;
      padding: 0 12px;
      font: inherit;
      font-weight: 700;
      letter-spacing: -0.02em;
      cursor: pointer;
      transition: transform 140ms ease, background-color 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .size-chip:hover {
      transform: translateY(-1px);
      background: rgba(10, 132, 255, 0.10);
      border-color: rgba(10, 132, 255, 0.28);
    }

    .size-chip:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }

    .size-sep {
      color: var(--subtext);
      font-weight: 600;
    }

    .size-unit {
      color: var(--subtext);
      font-size: 0.95rem;
      font-weight: 600;
      margin-left: 2px;
    }

    .metric .value.volume {
      font-size: clamp(1.4rem, 2.5vw, 1.9rem);
    }

    .metric .value.vrr {
      font-size: clamp(1.4rem, 2.5vw, 1.9rem);
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hint-line {
      margin-top: 10px;
      color: var(--subtext);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .empty-state {
      padding: 22px;
      border-radius: 20px;
      border: 1px dashed rgba(0, 0, 0, 0.12);
      background: rgba(255, 255, 255, 0.58);
      color: var(--subtext);
      text-align: center;
      line-height: 1.6;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: rgba(28, 28, 30, 0.96);
      color: white;
      padding: 12px 16px;
      border-radius: 999px;
      font-size: 0.92rem;
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.18);
      transition: opacity 180ms ease, transform 180ms ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 920px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .entry-panel {
        position: static;
      }
    }

    @media (max-width: 640px) {
      .app {
        width: min(var(--max), calc(100% - 20px));
        padding: 16px 0 28px;
      }

      .panel-inner {
        padding: 18px;
      }

      input[type="text"] {
        height: 68px;
        font-size: clamp(1.35rem, 7vw, 2rem);
        border-radius: 18px;
      }

      .metric {
        grid-column: span 12;
      }

      .row-card {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>VRR Calculator</h1>
      <div class="subtitle">Enter three diameters in cm.</div>
    </header>

    <main class="grid">
      <section class="panel entry-panel" aria-labelledby="input-title">
        <div class="panel-inner">
          <div class="section-title" id="input-title">Input</div>
          <div class="row-select-wrap">
            <div class="row-select-label">Row</div>
            <select class="row-select" id="rowTargetSelect" aria-label="Select input row"></select>
          </div>
          <div class="prompt" id="promptText">Initial - first diameter (cm)</div>
          <div class="edit-banner" id="editBanner" hidden></div>

          <div class="input-wrap">
            <input
              id="diameterInput"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="Initial - first diameter (cm)"
              aria-label="Diameter input"
            />
          </div>

          <div class="error" id="errorMessage" aria-live="polite"></div>

          <div class="summary-actions">
            <button class="btn-secondary" id="resetBtn" type="button">Reset</button>
            <button class="btn-secondary" id="cancelEditBtn" type="button" hidden>Cancel Edit</button>
            <button class="btn-primary" id="copyBtn" type="button">Copy Summary</button>
          </div>
        </div>
      </section>

      <section class="panel" aria-labelledby="results-title">
        <div class="panel-inner">
          <div class="results-head">
            <div>
              <div class="section-title">Results</div>
              <h2 class="results-title" id="results-title">Calculated rows</h2>
              <p class="results-subtitle">Rows are ordered by follow-up timing.</p>
            </div>
          </div>

          <div id="rows" class="rows" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // VRR Calculator: single-file app with keyboard-first data entry.

    const FOLLOWUP_PERIOD_OPTIONS = ['1 month', '3 month', '6 month', '1 year', '2 year', '3 year', '4 year', '5 year'];
    const FOLLOWUP_PERIOD_MONTHS = {
      '1 month': 1,
      '3 month': 3,
      '6 month': 6,
      '1 year': 12,
      '2 year': 24,
      '3 year': 36,
      '4 year': 48,
      '5 year': 60,
    };

    const state = {
      phase: 'initial',
      stepIndex: 0,
      currentValues: [],
      initial: null,
      followups: [],
      editTarget: null,
      rowCounter: 0,
    };

    const el = {
      input: document.getElementById('diameterInput'),
      prompt: document.getElementById('promptText'),
      progress: document.getElementById('progressText'),
      error: document.getElementById('errorMessage'),
      editBanner: document.getElementById('editBanner'),
      rowTarget: document.getElementById('rowTargetSelect'),
      rows: document.getElementById('rows'),
      reset: document.getElementById('resetBtn'),
      cancelEdit: document.getElementById('cancelEditBtn'),
      copy: document.getElementById('copyBtn'),
      toast: document.getElementById('toast'),
    };

    function formatNumber(value, digits) {
      return Number(value).toFixed(digits);
    }

    function calculateVolume(a, b, c) {
      return (Math.PI / 6) * a * b * c;
    }

    function calculateVRR(initialVolume, followUpVolume) {
      return ((initialVolume - followUpVolume) / initialVolume) * 100;
    }

    function formatSize(values) {
      return `${values.map(v => formatNumber(v, 1)).join(' × ')} cm`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function getPhaseLabel() {
      if (state.phase === 'initial') return 'Initial';
      return 'Next follow-up';
    }

    function getFollowupIndexByUid(uid) {
      return state.followups.findIndex(row => row.uid === uid);
    }

    function getFollowupLabelByUid(uid) {
      const index = getFollowupIndexByUid(uid);
      return index >= 0 ? `F/U ${index + 1}` : 'F/U';
    }

    function getEditLabel(target) {
      if (!target) return '';
      if (target.kind === 'initial') return 'Initial';
      return getFollowupLabelByUid(target.uid);
    }

    function getTargetPartName(index) {
      return ['first', 'second', 'third'][index] || 'selected';
    }

    function getPeriodSelectValue(row) {
      if (!row?.period) return '';
      return FOLLOWUP_PERIOD_OPTIONS.includes(row.period) ? row.period : '__custom__';
    }

    function parsePeriodMonths(period) {
      const text = String(period || '').trim().toLowerCase();
      if (!text) return Number.POSITIVE_INFINITY;
      if (FOLLOWUP_PERIOD_MONTHS[period]) return FOLLOWUP_PERIOD_MONTHS[period];
      const match = text.match(/^(\d+(?:\.\d+)?)\s*(month|months|mo|year|years|yr|yrs)$/i);
      if (!match) return Number.POSITIVE_INFINITY;
      const value = Number(match[1]);
      if (!Number.isFinite(value) || value <= 0) return Number.POSITIVE_INFINITY;
      const unit = match[2].toLowerCase();
      return unit.startsWith('year') || unit.startsWith('yr') ? value * 12 : value;
    }

    function sortFollowups() {
      state.followups.sort((a, b) => {
        const diff = (a.sortValue ?? Number.POSITIVE_INFINITY) - (b.sortValue ?? Number.POSITIVE_INFINITY);
        if (diff !== 0) return diff;
        return (a.createdAt ?? 0) - (b.createdAt ?? 0);
      });
      state.followups.forEach((row, index) => { row.label = `F/U ${index + 1}`; });
    }

    function buildInputTargetOptions() {
      const options = ['<option value="next">Next follow-up</option>'];
      if (state.initial) options.push('<option value="initial">Initial</option>');
      state.followups.forEach((row) => {
        options.push(`<option value="followup:${row.uid}">${escapeHtml(row.label)}</option>`);
      });
      return options.join('');
    }

    function getCurrentPlaceholder() {
      if (state.editTarget?.mode === 'cell') {
        return `${getEditLabel(state.editTarget)} - ${getTargetPartName(state.editTarget.cellIndex)} diameter (cm)`;
      }
      const label = state.editTarget ? getEditLabel(state.editTarget) : (state.initial ? 'Next follow-up' : 'Initial');
      return `${label} - ${['first', 'second', 'third'][state.stepIndex]} diameter (cm)`;
    }

    function getProgressText() {
      if (state.editTarget?.mode === 'cell') {
        return `${getEditLabel(state.editTarget)} · ${getTargetPartName(state.editTarget.cellIndex)}`;
      }
      const label = state.editTarget ? getEditLabel(state.editTarget) : (state.initial ? 'Next follow-up' : 'Initial');
      return `${label} · ${state.stepIndex + 1}/3`;
    }

    function showError(message) {
      el.error.textContent = message;
      el.error.classList.remove('shake');
      void el.error.offsetWidth; // restart animation
      el.error.classList.add('shake');
    }

    function clearError() {
      el.error.textContent = '';
      el.error.classList.remove('shake');
    }

    function showToast(message) {
      el.toast.textContent = message;
      el.toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.toast.classList.remove('show'), 1500);
    }

    function setInputFocus(selectAll = true) {
      requestAnimationFrame(() => {
        el.input.focus();
        if (selectAll) el.input.select?.();
      });
    }

    function parsePositiveNumber(text) {
      const trimmed = String(text).trim();
      if (trimmed === '') return null;
      if (!/^(?:\d+(?:\.\d+)?|\.\d+)$/.test(trimmed)) return NaN;
      const value = Number(trimmed);
      if (!Number.isFinite(value)) return NaN;
      if (value <= 0) return NaN;
      return value;
    }

    function buildRowData(label, values, initialVolume = null, meta = {}) {
      const volume = calculateVolume(values[0], values[1], values[2]);
      const period = typeof meta.period === 'string' ? meta.period.trim() : '';
      const sortValue = typeof meta.sortValue === 'number' ? meta.sortValue : parsePeriodMonths(period);
      return {
        uid: meta.uid || `row-${++state.rowCounter}`,
        label,
        values: [...values],
        volume,
        vrr: initialVolume === null ? null : calculateVRR(initialVolume, volume),
        period,
        sortValue,
        createdAt: typeof meta.createdAt === 'number' ? meta.createdAt : Date.now(),
        periodMode: meta.periodMode || (period ? (FOLLOWUP_PERIOD_OPTIONS.includes(period) ? 'preset' : 'custom') : 'none'),
      };
    }

    function clearDraft() {
      state.currentValues = [];
      state.stepIndex = 0;
      el.input.value = '';
    }

    function cancelEdit() {
      state.editTarget = null;
      clearDraft();
      clearError();
      renderAll();
      setInputFocus();
      showToast('Edit cancelled');
    }

    function beginRowEdit(target) {
      state.editTarget = { ...target, mode: 'row' };
      clearDraft();
      clearError();
      renderAll();
      setInputFocus();
    }

    function beginCellEdit(target, cellIndex) {
      state.editTarget = { ...target, mode: 'cell', cellIndex };
      clearDraft();
      clearError();
      const row = target.kind === 'initial'
        ? state.initial
        : state.followups[getFollowupIndexByUid(target.uid)];
      const currentValue = row?.values[cellIndex];
      el.input.value = formatNumber(currentValue, 1);
      renderAll();
      setInputFocus(true);
    }

    function updateRowPeriod(uid, nextPeriod, nextMode = 'preset') {
      const index = getFollowupIndexByUid(uid);
      if (index < 0) return;
      const row = state.followups[index];
      row.period = String(nextPeriod || '').trim();
      row.sortValue = parsePeriodMonths(row.period);
      row.periodMode = row.period ? nextMode : 'none';
      sortFollowups();
      renderAll();
    }

    function beginPeriodCustomEdit(uid) {
      const index = getFollowupIndexByUid(uid);
      if (index < 0) return;
      const row = state.followups[index];
      row.periodMode = 'custom';
      row.period = row.period && !FOLLOWUP_PERIOD_OPTIONS.includes(row.period) ? row.period : '';
      renderAll();
      requestAnimationFrame(() => {
        const input = el.rows.querySelector(`[data-period-custom="${uid}"]`);
        input?.focus();
        input?.select?.();
      });
    }

    function commitPeriodCustomEdit(uid, value) {
      const index = getFollowupIndexByUid(uid);
      if (index < 0) return;
      const row = state.followups[index];
      const text = String(value ?? '').trim();
      if (!text) {
        row.period = '';
        row.sortValue = Number.POSITIVE_INFINITY;
        row.periodMode = 'none';
      } else {
        row.period = text;
        row.sortValue = parsePeriodMonths(text);
        row.periodMode = 'custom';
      }
      sortFollowups();
      renderAll();
    }

    function finalizeRowEdit() {
      const isEditingInitial = state.editTarget?.kind === 'initial';
      const editingUid = state.editTarget?.kind === 'followup' ? state.editTarget.uid : null;
      const currentRow = isEditingInitial ? state.initial : (editingUid ? state.followups[getFollowupIndexByUid(editingUid)] : null);
      const rowLabel = state.editTarget
        ? (state.editTarget.kind === 'initial' ? 'Initial' : getFollowupLabelByUid(editingUid))
        : (state.initial ? `F/U ${state.followups.length + 1}` : 'Initial');
      const row = buildRowData(
        rowLabel,
        state.currentValues,
        state.initial ? state.initial.volume : null,
        state.editTarget?.kind === 'followup' && currentRow ? {
          uid: currentRow.uid,
          createdAt: currentRow.createdAt,
          period: currentRow.period,
          periodMode: currentRow.periodMode,
          sortValue: currentRow.sortValue,
        } : (state.editTarget?.kind === 'initial' && state.initial ? { uid: state.initial.uid, createdAt: state.initial.createdAt } : {})
      );

      if (state.editTarget) {
        if (state.editTarget.kind === 'initial') {
          row.uid = state.initial?.uid || row.uid;
          row.createdAt = state.initial?.createdAt || row.createdAt;
          state.initial = row;
          state.followups = state.followups.map(existing => ({
            ...existing,
            vrr: calculateVRR(state.initial.volume, existing.volume),
          }));
        } else {
          const index = getFollowupIndexByUid(editingUid);
          if (index >= 0) {
            state.followups[index] = row;
          } else {
            state.followups.push(row);
          }
        }
        state.editTarget = null;
      } else if (!state.initial) {
        state.initial = row;
      } else {
        state.followups.push(row);
      }

      if (state.followups.length) {
        sortFollowups();
        state.followups = state.followups.map(existing => ({
          ...existing,
          vrr: calculateVRR(state.initial.volume, existing.volume),
        }));
      }

      clearDraft();
      renderAll();
      clearError();
      setInputFocus();
    }

    function applyCellEdit(value) {
      const target = state.editTarget;
      const cellIndex = target.cellIndex;
      const row = target.kind === 'initial'
        ? state.initial
        : state.followups[getFollowupIndexByUid(target.uid)];
      const newValues = [...row.values];
      newValues[cellIndex] = value;

      if (target.kind === 'initial') {
        const updatedInitial = buildRowData('Initial', newValues, null, {
          uid: state.initial.uid,
          createdAt: state.initial.createdAt,
        });
        state.initial = updatedInitial;
        state.followups = state.followups.map(existing => ({
          ...existing,
          vrr: calculateVRR(updatedInitial.volume, existing.volume),
        }));
      } else {
        const updated = buildRowData(row.label, newValues, state.initial.volume, {
          uid: row.uid,
          createdAt: row.createdAt,
          period: row.period,
          periodMode: row.periodMode,
          sortValue: row.sortValue,
        });
        const index = getFollowupIndexByUid(target.uid);
        if (index >= 0) state.followups[index] = updated;
      }

      if (state.followups.length) {
        sortFollowups();
        state.followups = state.followups.map(existing => ({
          ...existing,
          vrr: calculateVRR(state.initial.volume, existing.volume),
        }));
      }

      state.editTarget = null;
      clearDraft();
      renderAll();
      clearError();
      setInputFocus();
    }

    function handleEnter() {
      const value = parsePositiveNumber(el.input.value);
      if (value === null) {
        showError('Please enter a positive number greater than 0.');
        return;
      }
      if (Number.isNaN(value)) {
        showError('Only numeric values greater than 0 are allowed.');
        return;
      }

      clearError();

      if (state.editTarget?.mode === 'cell') {
        applyCellEdit(value);
        return;
      }

      state.currentValues.push(value);
      el.input.value = '';

      if (state.currentValues.length === 3) {
        finalizeRowEdit();
        return;
      }

      state.stepIndex += 1;
      renderChromeOnly();
      setInputFocus();
    }

    function renderChromeOnly() {
      const placeholder = getCurrentPlaceholder();
      el.prompt.textContent = placeholder;
      el.input.placeholder = placeholder;
      const isEditing = !!state.editTarget;
      el.editBanner.hidden = !isEditing;
      el.cancelEdit.hidden = !isEditing;
      el.editBanner.textContent = isEditing
        ? (state.editTarget.mode === 'cell'
          ? `${getEditLabel(state.editTarget)} · ${getTargetPartName(state.editTarget.cellIndex)} diameter`
          : (state.editTarget.kind === 'initial'
            ? 'Editing Initial'
            : `Editing ${getEditLabel(state.editTarget)}`))
        : '';
      if (el.rowTarget) {
        el.rowTarget.innerHTML = buildInputTargetOptions();
        el.rowTarget.value = state.editTarget
          ? (state.editTarget.kind === 'initial' ? 'initial' : `followup:${state.editTarget.uid}`)
          : 'next';
      }
    }

    function rowBadge(row) {
      if (row.label === 'Initial') {
        return '<span class="badge neutral">Baseline</span>';
      }
      const vrr = row.vrr ?? 0;
      if (vrr > 0) return `<span class="badge good">Reduction</span>`;
      if (vrr < 0) return `<span class="badge bad">Increase</span>`;
      return `<span class="badge accent">Stable</span>`;
    }

    function renderRow(row, kind, index = null) {
      const card = document.createElement('article');
      card.className = 'row-card';

      const isEditing = state.editTarget
        && ((kind === 'initial' && state.editTarget.kind === 'initial')
          || (kind === 'followup' && state.editTarget.kind === 'followup' && state.editTarget.uid === row.uid));

      if (isEditing) card.classList.add('is-editing');

      const badgeClass = row.label === 'Initial'
        ? 'neutral'
        : row.vrr > 0
          ? 'good'
          : row.vrr < 0
            ? 'bad'
            : 'accent';

      const periodSelectValue = row.label === 'Initial' ? '' : getPeriodSelectValue(row);
      const periodChip = row.label === 'Initial'
        ? '<span class="row-edit-pill">Fixed</span>'
        : `
          <div class="row-period-control" aria-label="Follow-up timing controls">
            <select class="row-period-select" data-period-select="${row.uid}" aria-label="Set follow-up timing for ${row.label}">
              <option value="">Set timing</option>
              ${FOLLOWUP_PERIOD_OPTIONS.map(option => `<option value="${escapeHtml(option)}" ${periodSelectValue === option ? 'selected' : ''}>${escapeHtml(option)}</option>`).join('')}
              <option value="__custom__" ${periodSelectValue === '__custom__' ? 'selected' : ''}>Custom…</option>
            </select>
            ${row.periodMode === 'custom' ? `<input class="row-period-custom" data-period-custom="${row.uid}" type="text" value="${escapeHtml(row.period)}" placeholder="Custom period" aria-label="Custom follow-up timing for ${row.label}" />` : ''}
          </div>
        `;

      card.innerHTML = `
        <div class="row-top">
          <div class="row-label-block">
            <div class="row-label">${row.label}</div>
            ${periodChip}
          </div>
          <div class="row-actions">
            <div class="badge ${badgeClass}">${row.label === 'Initial' ? 'Baseline' : (row.vrr > 0 ? 'Reduction' : row.vrr < 0 ? 'Increase' : 'Stable')}</div>
          </div>
        </div>
        <div class="card-grid">
          <div class="metric wide">
            <div class="kicker">Size</div>
            <div class="size-inline">
              ${row.values.map((value, idx) => `
                <button class="size-chip" type="button" data-cell="${idx}" aria-label="Edit ${row.label} ${getTargetPartName(idx)} diameter">${formatNumber(value, 1)}</button>${idx < 2 ? '<span class="size-sep">×</span>' : ''}
              `).join('')}
              <span class="size-unit">cm</span>
            </div>
          </div>
          <div class="metric">
            <div class="kicker">Volume</div>
            <div class="value volume">${formatNumber(row.volume, 2)} cc</div>
          </div>
          <div class="metric">
            <div class="kicker">VRR</div>
            <div class="value vrr ${row.label === 'Initial' ? 'neutral' : (row.vrr > 0 ? 'good' : row.vrr < 0 ? 'bad' : 'accent')}">${row.label === 'Initial' ? 'Baseline' : `${formatNumber(row.vrr, 1)}%`}</div>
          </div>
        </div>
      `;

      const openRowEdit = () => beginRowEdit(kind === 'initial' ? { kind: 'initial' } : { kind: 'followup', uid: row.uid });
      card.addEventListener('click', (event) => {
        if (event.target.closest('.size-chip, .row-period-select, .row-period-custom')) return;
        openRowEdit();
      });
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', `Edit ${row.label}`);
      card.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openRowEdit();
        }
      });

      card.querySelectorAll('.size-chip').forEach((button) => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          const cellIndex = Number(button.dataset.cell);
          beginCellEdit(kind === 'initial' ? { kind: 'initial' } : { kind: 'followup', uid: row.uid }, cellIndex);
        });
      });

      const periodSelect = card.querySelector('.row-period-select');
      if (periodSelect) {
        periodSelect.addEventListener('click', (event) => event.stopPropagation());
        periodSelect.addEventListener('change', (event) => {
          event.stopPropagation();
          const value = event.target.value;
          if (value === '__custom__') {
            beginPeriodCustomEdit(row.uid);
            return;
          }
          updateRowPeriod(row.uid, value, value ? 'preset' : 'none');
        });
      }

      const periodCustom = card.querySelector('.row-period-custom');
      if (periodCustom) {
        periodCustom.addEventListener('click', (event) => event.stopPropagation());
        periodCustom.addEventListener('keydown', (event) => {
          event.stopPropagation();
          if (event.key === 'Enter') {
            event.preventDefault();
            commitPeriodCustomEdit(row.uid, periodCustom.value);
          }
        });
        periodCustom.addEventListener('blur', () => {
          commitPeriodCustomEdit(row.uid, periodCustom.value);
        });
      }

      return card;
    }

    function renderAll() {
      if (state.followups.length) {
        sortFollowups();
        state.followups = state.followups.map(existing => ({
          ...existing,
          vrr: calculateVRR(state.initial.volume, existing.volume),
        }));
      }

      renderChromeOnly();
      el.rows.innerHTML = '';

      if (!state.initial) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = 'No completed rows yet.<br>Enter the initial three diameters to generate the baseline row.';
        el.rows.appendChild(empty);
        return;
      }

      el.rows.appendChild(renderRow(state.initial, 'initial'));
      state.followups.forEach((row, index) => el.rows.appendChild(renderRow(row, 'followup', index)));
    }

    function resetAll() {
      state.phase = 'initial';
      state.stepIndex = 0;
      state.currentValues = [];
      state.initial = null;
      state.followups = [];
      state.editTarget = null;
      el.input.value = '';
      clearError();
      renderAll();
      setInputFocus();
      showToast('Reset complete');
    }

    function buildSummary() {
      if (!state.initial) return '';
      const lines = [];
      lines.push(`Initial: ${state.initial.values.map(v => formatNumber(v, 1)).join(' × ')} cm, Volume ${formatNumber(state.initial.volume, 2)} cc`);
      state.followups.forEach((row, idx) => {
        const timing = row.period ? ` (${row.period})` : '';
        lines.push(`F/U ${idx + 1}${timing}: ${row.values.map(v => formatNumber(v, 1)).join(' × ')} cm, Volume ${formatNumber(row.volume, 2)} cc, VRR ${formatNumber(row.vrr, 1)}%`);
      });
      return lines.join('\n');
    }

    async function copySummary() {
      const summary = buildSummary();
      if (!summary) {
        showError('Enter the initial row first, then copy the summary.');
        return;
      }

      try {
        await navigator.clipboard.writeText(summary);
        showToast('Summary copied to clipboard');
      } catch (err) {
        // Fallback for file:// or clipboard-restricted environments.
        const ta = document.createElement('textarea');
        ta.value = summary;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast('Summary copied to clipboard');
      }
    }

    // Input flow: Enter only. Keep focus on the single input at all times.
    el.input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        handleEnter();
      }
    });

    el.input.addEventListener('input', () => {
      clearError();
      renderChromeOnly();
    });

    el.rowTarget?.addEventListener('change', () => {
      const value = el.rowTarget.value;
      if (value === 'next') {
        state.editTarget = null;
        clearDraft();
        clearError();
        renderAll();
        setInputFocus();
        return;
      }
      if (value === 'initial') {
        beginRowEdit({ kind: 'initial' });
        return;
      }
      if (value.startsWith('followup:')) {
        const uid = value.slice('followup:'.length);
        beginRowEdit({ kind: 'followup', uid });
      }
    });

    el.reset.addEventListener('click', resetAll);
    el.cancelEdit.addEventListener('click', cancelEdit);
    el.copy.addEventListener('click', copySummary);

    // Restore focus when clicking elsewhere so the app feels keyboard-first.
    document.addEventListener('click', (event) => {
      if (!event.target.closest('button')) setInputFocus();
    });

    // Initial paint.
    renderAll();
    setInputFocus();
  </script>
</body>
</html>
