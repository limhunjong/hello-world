<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🐯 호랑이 다마고치</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════
   CSS 변수 팔레트
══════════════════════════════════════════ */
:root{
  --red:#E8001A;
  --blue:#0033CC;
  --yellow:#FFE000;
  --black:#111111;
  --white:#FFFFFF;
  --case:#F5EFDF;
  --lcd:#7AB840;
  --lcd-dark:#4a7a18;
  --hotpink:#FF2D78;
  --purple:#8833DD;
  --cyan:#00C8C8;
  --orange:#FF8800;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}

body{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px 0 48px;
  font-family:'Jua',cursive;
  background:linear-gradient(160deg,#FFDDC8 0%,#FFD0B0 40%,#FFF0C0 100%);
}

/* ══════════════════════════════════════════
   디바이스 래퍼 & 드롭쉐도우
══════════════════════════════════════════ */
.device-wrap{
  display:flex;flex-direction:column;align-items:center;
  filter:drop-shadow(0 22px 48px rgba(0,0,0,0.38)) drop-shadow(0 6px 12px rgba(0,0,0,0.22));
}

/* ══════════════════════════════════════════
   키체인 고리 — 금속 플라스틱
══════════════════════════════════════════ */
.device-ring{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,#f5f5f5 0%,#cccccc 30%,#ffffff 50%,#999999 70%,#bbbbbb 100%);
  border:4px solid var(--black);
  box-shadow:
    inset 0 0 0 5px rgba(0,0,0,0.28),
    inset 0 0 0 7px rgba(180,180,180,0.5),
    2px 2px 6px rgba(0,0,0,0.35);
  position:relative;z-index:11;margin-bottom:-8px;
}

/* ══════════════════════════════════════════
   디바이스 본체 — 스티커봄 케이스
══════════════════════════════════════════ */
.device{
  width:clamp(278px,92vw,302px);
  background:var(--case);
  border-radius:48% 48% 44% 44% / 38% 38% 62% 62%;
  border:5px solid var(--black);
  box-shadow:
    0 0 0 8px var(--yellow),
    0 0 0 13px var(--black),
    0 8px 0 13px rgba(0,0,0,0.15);
  padding:14px 14px 48px;
  position:relative;z-index:10;
  overflow:hidden; /* 스티커 클립 */
}

/* 케이스 상단 광택 하이라이트 */
.device::after{
  content:'';
  position:absolute;top:4%;left:15%;width:70%;height:22%;
  background:radial-gradient(ellipse at 50% 20%,rgba(255,255,255,0.55) 0%,transparent 75%);
  border-radius:50%;pointer-events:none;z-index:3;
}

/* ══════════════════════════════════════════
   device-inner — 브랜드 + 화면 + 버튼
   (스티커보다 위에 있어야 함)
══════════════════════════════════════════ */
.device-inner{
  position:relative;z-index:5;
}

/* ══════════════════════════════════════════
   스티커 공통
══════════════════════════════════════════ */
.sticker{
  position:absolute;
  pointer-events:none;
  z-index:2;
  font-family:'Jua',cursive;
  user-select:none;
}

/* 별 */
.sticker-star{
  font-size:28px;
  color:var(--yellow);
  -webkit-text-stroke:3.5px var(--black);
  text-shadow:2px 2px 0 rgba(0,0,0,0.2);
  line-height:1;
}
.sticker-star.red{ color:var(--red); }
.sticker-star.blue{ color:var(--blue); }
.sticker-star.white{ color:#fff; -webkit-text-stroke:3px var(--black); }

/* 번개 */
.sticker-lightning{
  font-size:30px;
  filter:
    drop-shadow(2px 0 0 var(--black))
    drop-shadow(-2px 0 0 var(--black))
    drop-shadow(0 2px 0 var(--black))
    drop-shadow(0 -2px 0 var(--black));
  line-height:1;
}

/* 말풍선 */
.sticker-bubble{
  background:var(--white);
  border:3px solid var(--black);
  border-radius:8px;
  padding:3px 8px;
  font-size:11px;
  font-weight:900;
  color:var(--black);
  box-shadow:3px 3px 0 var(--black);
  white-space:nowrap;
  line-height:1.3;
}
.sticker-bubble.red{ background:var(--red);color:#fff; }
.sticker-bubble.blue{ background:var(--blue);color:#fff; }
.sticker-bubble.yellow{ background:var(--yellow); }
.sticker-bubble.pink{ background:var(--hotpink);color:#fff; }

/* 호랑이 페이스 */
.sticker-tiger{
  font-size:26px;
  filter:
    drop-shadow(1px 0 0 var(--black))
    drop-shadow(-1px 0 0 var(--black))
    drop-shadow(0 1px 0 var(--black))
    drop-shadow(0 -1px 0 var(--black));
  line-height:1;
}

/* 도트 패턴 */
.sticker-dots{
  width:40px;height:26px;
  background:radial-gradient(circle,var(--black) 34%,transparent 34%);
  background-size:8px 8px;
  opacity:0.28;
  border-radius:3px;
}

/* 삼각형 */
.sticker-tri{
  width:0;height:0;
  filter:drop-shadow(1px 1px 0 var(--black)) drop-shadow(-1px 0 0 var(--black));
}
.sticker-tri.red { border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:24px solid var(--red); }
.sticker-tri.blue{ border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:24px solid var(--blue);}
.sticker-tri.yellow{border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:20px solid var(--yellow);}

/* 하트 */
.sticker-heart{
  font-size:22px;
  color:var(--hotpink);
  -webkit-text-stroke:2.5px var(--black);
  line-height:1;
}

/* ══════════════════════════════════════════
   브랜드 로고
══════════════════════════════════════════ */
.brand-area{
  text-align:center;
  margin-bottom:10px;
  position:relative;
  padding:4px 0 2px;
}
/* 폭발형 배경 */
.brand-area::before{
  content:'';
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:85%;height:130%;
  background:var(--red);
  clip-path:polygon(5% 30%,10% 5%,25% 18%,40% 0%,50% 15%,60% 0%,75% 18%,90% 5%,95% 30%,100% 50%,95% 70%,90% 95%,75% 82%,60% 100%,50% 85%,40% 100%,25% 82%,10% 95%,5% 70%,0% 50%);
  z-index:0;
}
.brand-logo{
  position:relative;z-index:1;
  font-size:clamp(17px,5.5vw,21px);
  font-style:italic;font-weight:900;
  color:var(--yellow);
  -webkit-text-stroke:4px var(--black);
  text-shadow:3px 3px 0 rgba(0,0,0,0.45);
  display:inline-block;
  transform:rotate(-3deg);
  letter-spacing:0.5px;
  line-height:1.1;
  white-space:nowrap;
}

/* ══════════════════════════════════════════
   화면 베젤 — 두꺼운 플라스틱 프레임
══════════════════════════════════════════ */
.screen-bezel{
  background:var(--black);
  border-radius:12px;
  padding:7px 7px 9px;
  border:3px solid rgba(255,255,255,0.12);
  box-shadow:
    inset 0 6px 18px rgba(0,0,0,0.8),
    inset 0 0 0 2px rgba(255,255,255,0.06),
    0 3px 8px rgba(0,0,0,0.4);
}

/* ══════════════════════════════════════════
   LCD 화면
══════════════════════════════════════════ */
.screen{
  background:var(--lcd);
  border-radius:6px;
  border:2px solid var(--lcd-dark);
  position:relative;overflow:hidden;min-height:252px;
}

/* 대나무 게임 배경 */
.screen::before{
  content:'';
  position:absolute;inset:0;
  pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0px, transparent 20px,
      rgba(30,70,5,0.14) 20px, rgba(30,70,5,0.14) 23px,
      transparent 23px, transparent 43px,
      rgba(20,55,3,0.10) 43px, rgba(20,55,3,0.10) 46px
    );
}

/* scanline */
.screen::after{
  content:'';
  position:absolute;inset:0;border-radius:4px;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    transparent, transparent 3px,
    rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px
  );
  z-index:50;
}

/* ══════════════════════════════════════════
   아이콘 바
══════════════════════════════════════════ */
.icon-bar{
  display:flex;justify-content:space-around;align-items:flex-start;
  padding:5px 2px 8px;
  background:rgba(0,0,0,0.14);
  border-bottom:2px solid rgba(0,0,0,0.15);
  position:relative;z-index:2;
}
.sicon{
  width:24px;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;color:rgba(0,26,0,0.38);
  position:relative;
}
.sicon svg{width:16px;height:16px}
.sicon.active{color:rgba(0,26,0,0.9)}
.sicon.active::after{
  content:'▲';
  position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  font-size:6px;color:rgba(0,26,0,0.82);line-height:1;
}

/* ══════════════════════════════════════════
   호랑이 스테이지
══════════════════════════════════════════ */
.tiger-stage{
  height:136px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;z-index:2;
}
/* 미니 그라운드 라인 */
.tiger-stage::after{
  content:'';
  position:absolute;bottom:8px;left:10%;width:80%;height:3px;
  background:rgba(0,0,0,0.18);border-radius:50%;
  z-index:0;
}
.tiger-wrap{position:relative;display:inline-block}
.tiger-wrap.idle    {animation:idleBob 2.8s ease-in-out infinite}
.tiger-wrap.happy   {animation:happyJump 0.45s ease-in-out infinite}
.tiger-wrap.shaking {animation:shake 0.45s ease-in-out}
.tiger-wrap.sleeping{animation:sleepBreath 4s ease-in-out infinite}
@keyframes idleBob    {0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes happyJump  {0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.04)}}
@keyframes shake      {0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes sleepBreath{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.fx{position:absolute;font-size:20px;pointer-events:none;animation:fxUp 0.9s ease-out forwards;z-index:5}
@keyframes fxUp{0%{transform:translateY(0) scale(0.5);opacity:1}100%{transform:translateY(-58px) scale(1.4);opacity:0}}

/* ══════════════════════════════════════════
   말풍선
══════════════════════════════════════════ */
.msg-bubble{
  background:rgba(0,0,0,0.16);
  border:1px solid rgba(0,0,0,0.12);
  border-radius:7px;padding:3px 8px;
  text-align:center;font-size:10px;color:#0a2200;min-height:20px;
  margin-top:2px;position:relative;z-index:2;
}

/* ══════════════════════════════════════════
   스탯 바 — 게임 UI 패널
══════════════════════════════════════════ */
.stats{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;
  margin-top:4px;padding:4px 5px;
  background:rgba(0,0,0,0.18);
  border:2px solid rgba(0,0,0,0.2);
  border-radius:6px;
  position:relative;z-index:2;
}
.stat{display:flex;align-items:center;gap:3px}
.stat.full{grid-column:span 2}
.stat-lbl{font-size:8px;color:rgba(255,255,255,0.82);flex-shrink:0;width:24px;text-shadow:0 1px 2px rgba(0,0,0,0.5)}
.bar-bg{
  flex:1;height:9px;
  background:rgba(0,0,0,0.35);
  border-radius:5px;overflow:hidden;
  border:1.5px solid rgba(0,0,0,0.4);
}
.bar-fill{height:100%;border-radius:4px;transition:width 0.5s ease}
.bar-fill.low{animation:barBlink 0.7s ease-in-out infinite}
@keyframes barBlink{0%,100%{opacity:1}50%{opacity:0.15}}

/* 스탯 색상 — 선명한 장난감 컬러 */
.b-hunger .bar-fill{background:linear-gradient(90deg,#FF4400,#FF8800)}
.b-happy  .bar-fill{background:linear-gradient(90deg,#FF1A6E,#FF66AA)}
.b-health .bar-fill{background:linear-gradient(90deg,#0055FF,#44AAFF)}
.b-energy .bar-fill{background:linear-gradient(90deg,#8800EE,#CC44FF)}
.b-clean  .bar-fill{background:linear-gradient(90deg,#008899,#00DDDD)}

/* ══════════════════════════════════════════
   하단 상태 로우
══════════════════════════════════════════ */
.status-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:3px 5px;
  background:rgba(0,0,0,0.18);
  border:2px solid rgba(0,0,0,0.18);
  border-top:none;
  border-radius:0 0 5px 5px;
  margin-top:2px;
  font-size:9px;color:#0a2200;position:relative;z-index:2;
}
.coin-pill{
  background:rgba(255,210,0,0.35);
  border:1px solid rgba(180,130,0,0.5);
  border-radius:7px;padding:1px 5px;
  font-size:9px;color:#2a1800;display:flex;align-items:center;gap:2px;
}
.snd-btn{background:none;border:none;cursor:pointer;font-size:11px;padding:0;line-height:1}

/* ══════════════════════════════════════════
   죽음 오버레이
══════════════════════════════════════════ */
.dead-overlay{
  position:absolute;inset:0;background:rgba(0,10,0,0.9);border-radius:4px;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  color:#6aff6a;gap:7px;z-index:20;
}
.restart-btn{
  background:#182818;border:2px solid #348834;border-radius:12px;
  padding:7px 20px;color:#6aff6a;font-size:12px;font-family:'Jua',cursive;cursor:pointer;
  box-shadow:0 4px 0 #0a1a0a;
  transition:transform 0.08s,box-shadow 0.08s;
}
.restart-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1a0a}

/* ══════════════════════════════════════════
   씻기기 오버레이
══════════════════════════════════════════ */
.bath-overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#1a4e80 0%,#0e3060 100%);
  border-radius:4px;display:none;flex-direction:column;align-items:center;
  padding-top:12px;z-index:15;overflow:hidden;
}
.bath-bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
/* bath bubble — 스티커 클래스 충돌 방지를 위해 스코프 지정 */
.bath-bubbles .bubble{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,0.95),rgba(160,210,255,0.28));
  border:1px solid rgba(255,255,255,0.42);
  animation:bubbleRise linear forwards;pointer-events:none;
}
@keyframes bubbleRise{0%{transform:translateY(0) translateX(0);opacity:0.88}100%{transform:translateY(-210px) translateX(var(--dx,0px));opacity:0}}
.bath-tiger{position:relative;z-index:2;cursor:pointer;user-select:none;transition:transform 0.12s}
.bath-clean-bar{width:170px;height:12px;background:rgba(255,255,255,0.2);border-radius:6px;overflow:hidden;margin-top:9px;z-index:2;border:1px solid rgba(255,255,255,0.3)}
.bath-clean-fill{height:100%;background:linear-gradient(90deg,#40b8ff,#a8eeff);border-radius:6px;transition:width 0.25s ease}
.bath-label{color:rgba(255,255,255,0.9);font-size:11px;margin-top:5px;z-index:2;text-align:center}
.bath-done-btn{margin-top:11px;z-index:2;background:#f59e0b;border:none;border-radius:14px;padding:6px 20px;color:white;font-family:'Jua',cursive;font-size:12px;cursor:pointer;display:none}

/* ══════════════════════════════════════════
   옷장 오버레이
══════════════════════════════════════════ */
.wardrobe-overlay{
  position:absolute;inset:0;background:#35291c;border-radius:4px;
  display:none;flex-direction:column;z-index:15;overflow:hidden;
}
.wardrobe-header{
  background:rgba(0,0,0,0.3);padding:5px 8px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:11px;color:#f0d080;flex-shrink:0;
}
.wd-close{background:rgba(200,50,20,0.75);border:none;border-radius:50%;width:20px;height:20px;color:white;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.wardrobe-preview{display:flex;align-items:center;justify-content:center;flex-shrink:0;height:88px;position:relative}
.wardrobe-items{flex:1;overflow-y:auto;padding:4px 5px;display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:start}
.wd-item{background:rgba(255,255,255,0.07);border-radius:7px;padding:5px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid rgba(255,255,255,0.09);transition:background 0.12s,border 0.12s}
.wd-item.owned{border-color:rgba(245,158,11,0.42)}
.wd-item.on{background:rgba(245,158,11,0.18);border-color:#f59e0b}
.wd-item-em{font-size:20px}
.wd-item-name{font-size:9px;color:#e0c080}
.wd-item-price{font-size:9px;color:#f0d050}

/* ══════════════════════════════════════════
   두더지 잡기
══════════════════════════════════════════ */
.whack-overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#285818 0%,#183808 100%);
  border-radius:4px;display:none;flex-direction:column;z-index:15;overflow:hidden;
}
.whack-bg{
  position:absolute;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(90deg,
    transparent 0px,transparent 18px,
    rgba(20,60,5,0.18) 18px,rgba(20,60,5,0.18) 20px,
    transparent 20px,transparent 38px,
    rgba(30,80,10,0.12) 38px,rgba(30,80,10,0.12) 40px);
}
.whack-header{
  background:rgba(0,0,0,0.32);padding:5px 8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  font-size:11px;color:#b0ff90;position:relative;z-index:2;
}
.wh-score-label{display:flex;gap:8px;align-items:center}
.wh-close{background:rgba(200,50,20,0.72);border:none;border-radius:50%;width:20px;height:20px;color:white;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.whack-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:7px;padding:7px;flex:1;align-content:center;
  position:relative;z-index:2;
}
.whack-hole{
  background:radial-gradient(ellipse at center,#1a0a00 30%,#2a1408 100%);
  border-radius:50%;aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;cursor:pointer;
  box-shadow:
    inset 0 5px 12px rgba(0,0,0,0.75),
    inset 0 0 0 3px rgba(80,40,0,0.35),
    0 3px 6px rgba(0,0,0,0.4);
  border:2px solid rgba(60,28,0,0.5);
}
.wh-char{
  position:absolute;bottom:-115%;
  transition:bottom 0.14s ease-out;
  user-select:none;-webkit-user-select:none;pointer-events:none;
  width:90%;display:flex;align-items:flex-end;justify-content:center;
}
.wh-char.up{bottom:-4%}
.wh-char.hit{animation:wHit 0.22s ease-out forwards!important;transition:none!important}
@keyframes wHit{0%{transform:scale(1.4)}50%{transform:scale(0.6)}100%{transform:scale(0);opacity:0}}
.wh-pop{
  position:absolute;font-size:14px;font-weight:bold;
  pointer-events:none;animation:sPop 0.6s ease-out forwards;z-index:8;
  top:8%;left:50%;transform:translateX(-50%);white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,0,0,0.5);
}
@keyframes sPop{0%{transform:translateX(-50%) translateY(0);opacity:1}100%{transform:translateX(-50%) translateY(-28px);opacity:0}}
.wh-pop.good{color:#ffee00}
.wh-pop.bad {color:#ff4444}
.whack-result{
  position:absolute;inset:0;background:rgba(4,16,0,0.95);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:7px;text-align:center;border-radius:4px;z-index:10;
}
.whack-result h2{font-size:18px;color:#ffee44}
.whack-result p{font-size:12px;color:#b0ff90;line-height:1.6}
.wh-result-btn{background:#f59e0b;border:none;border-radius:13px;padding:6px 20px;color:white;font-family:'Jua',cursive;font-size:12px;cursor:pointer}

/* ══════════════════════════════════════════
   비밀번호 화면
══════════════════════════════════════════ */
.pw-overlay{
  position:fixed;inset:0;
  background:linear-gradient(160deg,#FFDDC8 0%,#FFD0B0 40%,#FFF0C0 100%);
  display:flex;align-items:center;justify-content:center;z-index:500
}
.pw-box{
  background:var(--white);
  border:4px solid var(--black);
  border-radius:22px;
  padding:24px 20px;text-align:center;width:278px;
  box-shadow:
    0 0 0 7px var(--yellow),
    0 0 0 11px var(--black),
    6px 10px 0 11px rgba(0,0,0,0.14);
  position:relative;
}
/* 폭발 배경 */
.pw-box::before{
  content:'';
  position:absolute;top:-16px;left:50%;transform:translateX(-50%);
  width:88%;height:34px;
  background:var(--red);
  clip-path:polygon(0% 60%,8% 0%,20% 40%,35% 0%,50% 35%,65% 0%,80% 40%,92% 0%,100% 60%,92% 100%,80% 65%,65% 100%,50% 70%,35% 100%,20% 65%,8% 100%);
  z-index:-1;
}
.pw-title{font-size:20px;color:var(--black);margin-bottom:4px;-webkit-text-stroke:0.5px var(--black)}
.pw-sub{font-size:11px;color:#666;margin-bottom:14px}
.pw-mode-btns{display:flex;gap:7px;justify-content:center;margin-bottom:12px}
.pw-mode-btn{
  padding:6px 14px;
  border:3px solid var(--black);border-radius:16px;
  font-family:'Jua',cursive;font-size:11px;cursor:pointer;
  background:#eee;color:var(--black);
  box-shadow:3px 3px 0 var(--black);
  transition:transform 0.08s,box-shadow 0.08s;
}
.pw-mode-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--black)}
.pw-mode-btn.active{background:var(--yellow);}
.pw-dots{display:flex;justify-content:center;gap:10px;margin-bottom:14px}
.pw-dot{
  width:18px;height:18px;border-radius:50%;
  background:#ddd;
  border:2.5px solid var(--black);
  box-shadow:2px 2px 0 rgba(0,0,0,0.2);
  transition:background 0.14s;
}
.pw-dot.filled{background:var(--yellow);box-shadow:0 0 5px rgba(245,220,0,0.6)}
.pw-numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pw-num{
  height:46px;
  border:3px solid var(--black);border-radius:10px;
  background:linear-gradient(145deg,#fff,#e8e8e8);
  color:var(--black);font-size:17px;font-family:'Jua',cursive;cursor:pointer;
  box-shadow:3px 4px 0 var(--black);
  transition:transform 0.08s,box-shadow 0.08s;
}
.pw-num:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--black)}
.pw-num.ok{
  background:linear-gradient(145deg,#FFE000,#FFB800);
  box-shadow:3px 4px 0 #886600;
}
.pw-num.ok:active{transform:translate(2px,3px);box-shadow:1px 1px 0 #886600}
.pw-err{color:var(--red);font-size:11px;min-height:16px;margin-top:2px;font-weight:bold}

/* ══════════════════════════════════════════
   이름 모달
══════════════════════════════════════════ */
.name-modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:200}
.name-box{
  background:var(--white);
  border:4px solid var(--black);
  border-radius:18px;padding:22px 18px;text-align:center;width:265px;

    0 0 0 7px var(--yellow),
    0 0 0 11px var(--black),
    6px 8px 0 11px rgba(0,0,0,0.12);
}
.name-box h2{font-size:16px;color:var(--black);margin-bottom:3px}
.name-box p{font-size:11px;color:#555;margin-bottom:12px}
.name-input{
  width:100%;padding:8px 12px;
  border:3px solid var(--black);border-radius:9px;
  font-family:'Jua',cursive;font-size:14px;text-align:center;
  background:#fffde8;outline:none;color:#330000;margin-bottom:10px;
  box-shadow:2px 2px 0 var(--black);
}
.name-input:focus{border-color:var(--red);box-shadow:2px 2px 0 var(--red)}
.name-ok{
  background:linear-gradient(145deg,var(--yellow),#FFB800);
  border:3px solid var(--black);border-radius:14px;
  padding:7px 24px;color:var(--black);
  font-size:13px;font-family:'Jua',cursive;cursor:pointer;
  font-weight:bold;
  box-shadow:3px 4px 0 var(--black);
  transition:transform 0.08s,box-shadow 0.08s;
}
.name-ok:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--black)}

/* ══════════════════════════════════════════
   3-버튼 — 플라스틱 장난감 버튼
══════════════════════════════════════════ */
.btns{
  display:flex;justify-content:center;align-items:center;gap:14px;
  padding:0 12px;margin-top:14px;
  position:relative;z-index:10;
}
/* 버튼 패널 배경 */
.btns::before{
  content:'';
  position:absolute;inset:-8px -6px;
  background:rgba(0,0,0,0.1);
  border-radius:20px;
  border:2px solid rgba(255,255,255,0.18);
}
.btn-group{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;z-index:1}
.btn-lbl{font-size:9px;color:rgba(0,0,0,0.55);letter-spacing:1px;font-weight:bold;text-shadow:0 1px 0 rgba(255,255,255,0.6)}
.btn-c{
  width:46px;height:46px;border-radius:50%;
  border:3.5px solid var(--black);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-family:'Jua',cursive;font-size:14px;font-weight:900;
  transition:transform 0.07s,box-shadow 0.07s;
}

/* A — 크림/흰 버튼 */
.btn-a{
  background:linear-gradient(145deg,#fff 0%,#e8e8e8 100%);
  color:var(--black);
  box-shadow:0 6px 0 #888888, 0 8px 0 var(--black), inset 0 2px 0 rgba(255,255,255,0.9);
}
.btn-a:active{transform:translateY(5px);box-shadow:0 1px 0 #888888,0 2px 0 var(--black),inset 0 2px 0 rgba(255,255,255,0.9)!important}

/* B — 노랑/주황 강조 버튼 */
.btn-b{
  background:linear-gradient(145deg,#FFE000 0%,#FFB800 100%);
  color:var(--black);
  width:54px;height:54px;
  border-width:4px;
  box-shadow:0 7px 0 #AA7700, 0 9px 0 var(--black), inset 0 2px 0 rgba(255,255,255,0.7);
}
.btn-b:active{transform:translateY(6px);box-shadow:0 1px 0 #AA7700,0 2px 0 var(--black),inset 0 2px 0 rgba(255,255,255,0.7)!important}

/* C — 파랑 버튼 */
.btn-c-btn{
  background:linear-gradient(145deg,#4488FF 0%,#0033CC 100%);
  color:var(--white);
  box-shadow:0 6px 0 #001880, 0 8px 0 var(--black), inset 0 2px 0 rgba(255,255,255,0.4);
}
.btn-c-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #001880,0 2px 0 var(--black),inset 0 2px 0 rgba(255,255,255,0.4)!important}

/* btn-c wrapper active reset */
.btn-c:active{outline:none}

/* ══════════════════════════════════════════
   공통 UI
══════════════════════════════════════════ */
.toast{
  position:fixed;top:10px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:var(--black);
  border:3px solid var(--yellow);
  border-radius:16px;padding:6px 18px;font-size:12px;color:var(--white);

}
.toast.show{transform:translateX(-50%) translateY(0)}
.evo-flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:250;transition:opacity 0.55s ease}

/* ══════════════════════════════════════════

//  사운드 시스템 (Web Audio API)
// ══════════════════════════════════════════════════
const Sound = {
  _ctx:null,
  ctx(){if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();if(this._ctx.state==='suspended')this._ctx.resume();return this._ctx;},
  tone(f,v,d,t='sine',s=0){const c=this.ctx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=t;o.frequency.setValueAtTime(f,c.currentTime+s);g.gain.setValueAtTime(v,c.currentTime+s);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+s+d);o.start(c.currentTime+s);o.stop(c.currentTime+s+d+0.04);},
  sweep(f1,f2,v,d,s=0){const c=this.ctx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(f1,c.currentTime+s);o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+s+d);g.gain.setValueAtTime(v,c.currentTime+s);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+s+d);o.start(c.currentTime+s);o.stop(c.currentTime+s+d+0.04);},
  play(n){
    if(!G.soundOn)return;
    try{switch(n){
      case 'btn':   this.tone(880,0.05,0.07);break;
      case 'feed':  this.sweep(350,700,0.17,0.1);this.sweep(700,500,0.12,0.08,0.13);break;
      case 'sleep': this.sweep(600,180,0.12,0.9);break;
      case 'clean': this.sweep(900,1300,0.1,0.06);this.tone(1100,0.1,0.17,'sine',0.07);break;
      case 'heal':  this.tone(1047,0.15,0.44);this.tone(1319,0.09,0.28,'sine',0.16);break;
      case 'pet':   this.tone(330,0.1,0.34);this.tone(440,0.08,0.28,'sine',0.1);break;
      case 'play':  [400,600,800].forEach((f,i)=>this.tone(f,0.13,0.12,'square',i*0.1));break;
      case 'evolve':[523,659,784,1047,1319].forEach((f,i)=>this.tone(f,0.19,0.28,'sine',i*0.13));break;
      case 'whack': this.sweep(500,1000,0.16,0.08);break;
      case 'golden':[800,1000,1200].forEach((f,i)=>this.tone(f,0.17,0.11,'sine',i*0.06));break;
      case 'penalty':this.tone(200,0.2,0.3,'sawtooth');this.tone(150,0.15,0.2,'sawtooth',0.12);break;
      case 'mgend': [500,450,400,350,300].forEach((f,i)=>this.tone(f,0.14,0.24,'square',i*0.11));break;
      case 'die':   [440,370,300,240,180].forEach((f,i)=>this.tone(f,0.13,0.4,'sine',i*0.3));break;
      case 'hatch': [440,550,660,880].forEach((f,i)=>this.tone(f,0.17,0.19,'sine',i*0.1));break;
      case 'buy':   [523,659,784].forEach((f,i)=>this.tone(f,0.14,0.17,'sine',i*0.08));break;
      case 'scrub': this.tone(350+Math.random()*200,0.05,0.05,'square');break;
    }}catch(e){}
  }
};

function updatePwDots(){for(let i=0;i<4;i++){const d=document.getElementById('pd'+i);if(d)d.classList.toggle('filled',i<pwBuf.length);}}
function pwOK(){
  if(pwBuf.length<4){document.getElementById('pw-err').textContent='4자리 이상 입력하세요';return;}
  if(pwMode==='load'){
    try{
      const raw=localStorage.getItem(SAVE_KEY);
      if(!raw){document.getElementById('pw-err').textContent='저장된 게임이 없어요';return;}
      const sv=JSON.parse(raw);
      const stored=sv.pw?atob(sv.pw):null;
      if(stored&&stored!==pwBuf){document.getElementById('pw-err').textContent='비밀번호가 틀렸어요 🔒';pwBuf='';updatePwDots();return;}
      G={...newGame(),...sv};
      const el=Math.min(3600,Math.floor((Date.now()-(sv.saved||Date.now()))/1000));
      if(el>60&&G.alive&&!G.sleeping){
        const d=Math.min(el,600);
        G.hunger=Math.max(0,G.hunger-d*0.083);G.happy=Math.max(0,G.happy-d*0.056);
        G.energy=Math.max(0,G.energy-d*0.042);G.clean=Math.max(0,G.clean-d*0.037);
        if(G.hunger<=0)G.health=Math.max(0,G.health-d*0.12);
        if(G.clean<20)G.health=Math.max(0,G.health-d*0.04);
        setTimeout(()=>toast(`${Math.round(el/60)}분 자리 비웠어요! 스탯이 감소했어요 😢`),700);
      }
      document.getElementById('pw-overlay').style.display='none';startGame();
    }catch(e){document.getElementById('pw-err').textContent='불러오기 실패. 새 게임을 시작하세요';}
  }else{
    G=newGame();G.pw=btoa(pwBuf);
    document.getElementById('pw-overlay').style.display='none';startGame();
    setTimeout(()=>toast('비밀번호 설정 완료! 잘 기억해두세요 🔑'),600);
  }
}

function getMood(){
  if(!G.alive)return'sick';if(G.sleeping)return'sleeping';
  if(G.health<30)return'sick';if(G.hunger<20)return'hungry';
  if(G.happy<20)return'sad';if(G.happy>75&&G.hunger>55)return'happy';return'idle';
}
function tigerWithCostumes(mood,sz,stage){
  const eq=G.equipped||[];
  if(!eq.length)return tigerSVG(mood,sz,stage);
  const W=Math.round(100*sz),H=Math.round(124*sz);
  let layers='';
  for(const cid of eq){const cp=CPOS[cid];const c=COSTUMES.find(x=>x.id===cid);if(!cp||!c)continue;layers+=`<div style="position:absolute;top:0;left:0;width:${W}px;height:${H}px;pointer-events:none"><svg width="${W}" height="${H}" viewBox="0 0 100 124" overflow="visible"><text x="${cp.x}" y="${cp.y}" text-anchor="middle" font-size="${cp.fs*sz}">${c.emoji}</text></svg></div>`;}
  return `<div style="position:relative;display:inline-block;width:${W}px;height:${H}px">${tigerSVG(mood,sz,stage)}${layers}</div>`;
}
function render(){
  const el=document.getElementById('tiger-stage');
  const mood=getMood(),ac=G.sleeping?'sleeping':animCls;
  el.innerHTML=G.stage===0?`<div class="tiger-wrap idle">${eggSVG(G.ticks)}</div>`:`<div class="tiger-wrap ${ac}">${tigerWithCostumes(mood,STAGE_SZ[G.stage],G.stage)}</div>`;
  for(const[k,v]of Object.entries({hunger:G.hunger,happy:G.happy,health:G.health,energy:G.energy,clean:G.clean})){const b=document.getElementById('b-'+k);if(!b)continue;b.style.width=Math.max(0,Math.min(100,v))+'%';b.classList.toggle('low',v<22);}
  const nm=G.name||'';
  document.getElementById('stage-name').textContent=STAGEE[G.stage]+' '+STAGES[G.stage];
  document.getElementById('name-disp').textContent=nm?`[${nm}]`:'';
  document.getElementById('age-disp').textContent=G.age+'일차';
  document.getElementById('coin-disp').textContent=G.coins||0;
  document.getElementById('snd-btn').textContent=G.soundOn?'🔊':'🔇';
}
function setMsg(mood,custom){const el=document.getElementById('msg-bubble');if(custom){el.textContent=custom;return;}const a=MSGS[mood]||MSGS.idle;el.textContent=a[Math.floor(Math.random()*a.length)];}
function showFX(emojis){const el=document.getElementById('tiger-stage');emojis.forEach((em,i)=>setTimeout(()=>{const d=document.createElement('div');d.className='fx';d.textContent=em;d.style.cssText=`left:${10+Math.random()*75}%;top:${20+Math.random()*45}%;position:absolute`;el.appendChild(d);setTimeout(()=>d.remove(),960);},i*140));}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2800);}
function setAnim(cls,dur){animCls=cls;setTimeout(()=>{animCls='idle';render();},dur||900);}

function doAction(a){
  if(!G.alive&&a!=='save')return;
  Sound.play('btn');let msg='';
  switch(a){
    case 'feed':
      if(G.sleeping){toast('자고 있어서 밥을 못 먹어요 💤');return;}
      if(G.hunger>=100){toast('배가 불러요! 🍖');return;}
      G.hunger=Math.min(100,G.hunger+30);G.happy=Math.min(100,G.happy+5);
      msg='냠냠~ 맛있어! 😋';showFX(['🍖','✨','💕']);setAnim('happy');Sound.play('feed');break;
    case 'play':
      if(G.sleeping){toast('자고 있어요 💤');return;}
      if(G.energy<10){toast('너무 피곤해서 못 놀아요 ⚡');return;}
      startWhack();return;
    case 'sleep':
      G.sleeping=!G.sleeping;msg=G.sleeping?'이제 잘래... 쿨쿨 💤':'잘 잤어! 이제 일어났어~ ☀️';
      toast(G.sleeping?'호랑이가 잠들었어요 💤':'호랑이가 일어났어요!');Sound.play('sleep');break;
    case 'clean':if(G.sleeping){toast('자는 중이에요 💤');return;}startBath();return;
    case 'wardrobe':openWardrobe();return;
    case 'heal':
      if(G.health>=100){toast('건강해요! 💊');return;}
      G.health=Math.min(100,G.health+30);G.happy=Math.max(0,G.happy-5);
      msg='약 먹었어... 쓰지만 나을 거야 💊';showFX(['💊','💚','✨']);setAnim('shaking',500);Sound.play('heal');break;
    case 'pet':
      if(G.sleeping){toast('자는 거 방해하지 마세요~ 💤');return;}
      G.happy=Math.min(100,G.happy+15);
      msg='그루~ 기분 좋아! ❤️';showFX(['❤️','💕','💗','✨']);setAnim('happy');Sound.play('pet');break;
    case 'save':save();toast('저장 완료! 🐾');return;
  }
  if(msg)setMsg(null,msg);save();render();
}

let bathProg=0,bathBI=null;
function startBath(){
  if(G.sleeping){toast('자는 중이에요 💤');return;}
  bathProg=G.clean;
  document.getElementById('bath-fill').style.width=bathProg+'%';
  document.getElementById('bath-label').textContent='호랑이를 탭해서 씻겨줘! 💧';

  document.getElementById('bath-bubbles').innerHTML='';
  document.getElementById('bath-overlay').style.display='flex';
  bathBI=setInterval(spawnBubble,400);
}
function spawnBubble(){
  const c=document.getElementById('bath-bubbles');if(!c)return;
  const b=document.createElement('div');b.className='bubble';
  const sz=5+Math.random()*16;const dx=(Math.random()-0.5)*30;
  b.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*88+5}%;bottom:${Math.random()*40}%;--dx:${dx}px;animation-duration:${1.4+Math.random()*2}s`;
  c.appendChild(b);setTimeout(()=>b.remove(),3500);
}
function scrubTiger(){
  if(bathProg>=100)return;
  Sound.play('scrub');bathProg=Math.min(100,bathProg+9);
  document.getElementById('bath-fill').style.width=bathProg+'%';
  for(let i=0;i<6;i++)spawnBubble();
  const t=document.getElementById('bath-tiger');
  t.style.transform=`scale(1.12) rotate(${(Math.random()-0.5)*12}deg)`;
  setTimeout(()=>{t.style.transform='';},150);
  if(bathProg>=100){document.getElementById('bath-label').textContent='완전히 깨끗해졌어! ✨';document.getElementById('bath-done').style.display='block';Sound.play('clean');}
  else document.getElementById('bath-label').textContent=`청결도 ${Math.round(bathProg)}% 💧`;
}
function finishBath(){clearInterval(bathBI);document.getElementById('bath-overlay').style.display='none';G.clean=100;G.happy=Math.min(100,G.happy+10);setMsg(null,'깨끗해졌다! 상쾌해~ 🛁');showFX(['🛁','💧','✨','🌟']);setAnim('happy');save();render();toast('목욕 완료! 청결도 100%! ✨');}
function forceCloseBath(){clearInterval(bathBI);document.getElementById('bath-overlay').style.display='none';if(bathProg>G.clean){G.clean=Math.min(100,bathProg);save();render();}}

function renderWdPreview(){document.getElementById('wd-preview').innerHTML=tigerWithCostumes(getMood(),0.72,G.stage||1);}
function renderWdItems(){
  const c=document.getElementById('wd-items');c.innerHTML='';
  COSTUMES.forEach(cs=>{
    const owned=(G.owned||[]).includes(cs.id),on=(G.equipped||[]).includes(cs.id);

function wdClick(cs){
  const owned=(G.owned||[]).includes(cs.id),on=(G.equipped||[]).includes(cs.id);
  if(!owned){if(G.coins<cs.price){toast(`코인 부족! (${cs.price} 필요) 🪙`);return;}G.coins-=cs.price;if(!G.owned)G.owned=[];G.owned.push(cs.id);if(!G.equipped)G.equipped=[];G.equipped=G.equipped.filter(eid=>{const ex=COSTUMES.find(x=>x.id===eid);return!(ex&&ex.layer===cs.layer);});G.equipped.push(cs.id);Sound.play('buy');toast(`${cs.name} 구매! 착용했어요 🎀`);}
  else if(on){G.equipped=(G.equipped||[]).filter(eid=>eid!==cs.id);Sound.play('btn');toast(`${cs.name} 벗었어요`);}
  else{if(!G.equipped)G.equipped=[];G.equipped=G.equipped.filter(eid=>{const ex=COSTUMES.find(x=>x.id===eid);return!(ex&&ex.layer===cs.layer);});G.equipped.push(cs.id);Sound.play('btn');toast(`${cs.name} 착용! 멋있어~ ✨`);}
  document.getElementById('wd-coins').textContent=G.coins||0;renderWdPreview();renderWdItems();save();
}

//  두더지 잡기 (3×3, 더 큰 캐릭터, 패널티 시스템)
// ══════════════════════════════════════════════════
// 캐릭터 종류: tiger(+10), golden(+50), ghost(-20), bomb(-30)
const WH_TYPES=[
  {type:'tiger', weight:55, coin:10,  penalty:false},
  {type:'golden',weight:12, coin:50,  penalty:false},
  {type:'ghost', weight:20, coin:-20, penalty:true},
  {type:'bomb',  weight:13, coin:-30, penalty:true},
];
function pickWhType(){
  const total=WH_TYPES.reduce((s,t)=>s+t.weight,0);
  let r=Math.random()*total;
  for(const t of WH_TYPES){r-=t.weight;if(r<=0)return t;}
  return WH_TYPES[0];
}

let wh={active:false,coins:0,timeLeft:30,timerID:null,spawnID:null,holes:[]};

function startWhack(){
  document.getElementById('whack-overlay').style.display='flex';
  document.getElementById('whack-result').style.display='none';
  wh={active:true,coins:0,timeLeft:30,timerID:null,spawnID:null,holes:[]};
  document.getElementById('wh-coins').textContent=0;
  document.getElementById('wh-timer').textContent=30;
  buildWhGrid();
  wh.spawnID=setInterval(spawnWH,850);
  wh.timerID=setInterval(()=>{wh.timeLeft--;document.getElementById('wh-timer').textContent=wh.timeLeft;if(wh.timeLeft<=0)endWhack();},1000);
  Sound.play('play');
}

function buildWhGrid(){
  const grid=document.getElementById('whack-grid');
  grid.innerHTML='';wh.holes=[];
  for(let i=0;i<9;i++){
    const hole=document.createElement('div');hole.className='whack-hole';
    const char=document.createElement('div');char.className='wh-char';
    hole.appendChild(char);
    const idx=i;
    hole.addEventListener('pointerdown',e=>{e.preventDefault();hitWH(idx,hole,char);});
    grid.appendChild(hole);
    wh.holes.push({el:hole,char,up:false,typeData:null,_t:null});
  }
}

function spawnWH(){
  if(!wh.active)return;
  const down=wh.holes.map((_,i)=>i).filter(i=>!wh.holes[i].up);
  if(!down.length)return;
  const idx=down[Math.floor(Math.random()*down.length)];
  const h=wh.holes[idx];
  const td=pickWhType();h.up=true;h.typeData=td;
  // 캐릭터 SVG 삽입 (더 큰 사이즈 사용)
  const sz=0.55;
  if(td.type==='tiger')     h.char.innerHTML=tigerSVG('happy',sz,1);
  else if(td.type==='golden')h.char.innerHTML=tigerSVG('happy',sz,4); // 왕관 호랑이
  else if(td.type==='ghost') h.char.innerHTML=ghostSVG(sz);
  else                       h.char.innerHTML=bombSVG(sz);
  h.char.classList.add('up');h.char.classList.remove('hit');
  clearTimeout(h._t);
  const stay=td.type==='golden'?800:td.penalty?1400:1200;
  h._t=setTimeout(()=>{if(h.up){h.up=false;h.char.classList.remove('up');}},stay);
}

function hitWH(idx,hole,char){
  if(!wh.active)return;
  const h=wh.holes[idx];
  if(!h.up||char.classList.contains('hit'))return;
  clearTimeout(h._t);h.up=false;
  char.classList.remove('up');char.classList.add('hit');
  setTimeout(()=>{char.classList.remove('hit');char.innerHTML='';},240);
  const td=h.typeData;
  const gain=td.coin;wh.coins=Math.max(-999,wh.coins+gain);
  document.getElementById('wh-coins').textContent=wh.coins;
  // 팝업
  const pop=document.createElement('div');
  pop.className='wh-pop '+(td.penalty?'bad':'good');
  pop.textContent=(gain>0?'+':'')+gain+(td.type==='ghost'?' 👻':td.type==='bomb'?' 💣':'');
  hole.appendChild(pop);setTimeout(()=>pop.remove(),650);
  // 패널티: 화면 빨간 테두리 깜빡임
  if(td.penalty){hole.style.boxShadow='inset 0 0 0 3px #ff3333,inset 0 5px 12px rgba(0,0,0,0.75)';setTimeout(()=>{hole.style.boxShadow='';},400);Sound.play('penalty');}
  else Sound.play(td.type==='golden'?'golden':'whack');
}

function endWhack(){
  wh.active=false;clearInterval(wh.timerID);clearInterval(wh.spawnID);
  wh.holes.forEach(h=>{clearTimeout(h._t);h.up=false;h.char.classList.remove('up');h.char.innerHTML='';});
  const earned=Math.max(0,wh.coins);
  G.coins=(G.coins||0)+earned;
  const hp=Math.min(30,Math.round(earned/5));
  G.happy=Math.min(100,G.happy+hp);G.energy=Math.max(0,G.energy-12);G.hunger=Math.max(0,G.hunger-8);
  document.getElementById('wh-result-txt').innerHTML=
    `🪙 코인 <b>+${earned}</b> 획득!<br>😊 행복도 +${hp}<br><small style="opacity:0.7">💡 유령/폭탄을 피하면 더 많이 버세요!</small>`;
  document.getElementById('whack-result').style.display='flex';
  Sound.play('mgend');save();render();
}
function closeWhack(){document.getElementById('whack-overlay').style.display='none';setMsg(null,`${G.name||'호랑이'}: 코인 ${Math.max(0,wh.coins)}개 획득! 야호~ 🐯`);setAnim('happy');}
function forceCloseWhack(){wh.active=false;clearInterval(wh.timerID);clearInterval(wh.spawnID);document.getElementById('whack-overlay').style.display='none';}

// ══════════════════════════════════════════════════
//  게임 루프
// ══════════════════════════════════════════════════
function tick(){
  if(!G.alive)return;G.ticks++;
  if(G.sleeping){
    G.energy=Math.min(100,G.energy+0.7);G.hunger=Math.max(0,G.hunger-0.055);
    if(G.energy>=100){G.sleeping=false;setMsg(null,`${G.name||'호랑이'}: 잘 잤어! 좋은 아침~ ☀️`);toast('호랑이가 자연스럽게 일어났어요!');}
  }else{
    G.hunger=Math.max(0,G.hunger-0.083);G.happy=Math.max(0,G.happy-0.056);
    G.energy=Math.max(0,G.energy-0.042);G.clean=Math.max(0,G.clean-0.037);
    if(G.hunger<=0)G.health=Math.max(0,G.health-0.17);
    if(G.clean<15) G.health=Math.max(0,G.health-0.05);
    if(G.happy<15) G.health=Math.max(0,G.health-0.03);
    if(G.hunger>55&&G.clean>50&&G.happy>45&&G.health<100)G.health=Math.min(100,G.health+0.06);
    if(G.ticks%90===0&&Math.random()<0.18){G.health=Math.max(0,G.health-12);toast('앗! 갑자기 아파요! 💊');setMsg(null,'으으... 갑자기 아파졌어 💊');}
  }
  if(G.ticks%60===0)G.age++;
  if(G.stage===0&&G.ticks>=22)evolve(1);
  const ss=G.ticks-22;
  if(G.stage===1&&ss>=EVO_SECS[2])evolve(2);
  if(G.stage===2&&ss>=EVO_SECS[3])evolve(3);
  if(G.stage===3&&ss>=EVO_SECS[4])evolve(4);
  if(G.health<=0&&G.alive){
    G.alive=false;
    document.getElementById('dead-msg').textContent=`${G.name||'호랑이'}가 하늘나라로...`;
    document.getElementById('dead-overlay').style.display='flex';
    setMsg(null,'안녕... 잘 있어... 😢');Sound.play('die');clearInterval(ticker);
  }
  if(G.ticks%2===0)render();if(G.ticks%25===0)setMsg(getMood());save();
}

function evolve(n){
  if(G.stage>=n)return;G.stage=n;
  const fl=document.getElementById('evoFlash');fl.style.opacity='1';setTimeout(()=>{fl.style.opacity='0';},130);
  Sound.play(n===1?'hatch':'evolve');
  if(n===1){toast('🐣 알이 깨졌어! 이름을 지어줘!');setTimeout(()=>{if(!G.name)showNameModal();},800);}
  else{toast('✨ '+STAGES[n]+'로 성장했어요! ✨');setMsg(null,'우와~ '+STAGES[n]+'가 됐어! ✨🐯');}
}

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({...G,saved:Date.now()}));}catch(e){}}
function restartGame(){const pw=G.pw,snd=G.soundOn;G=newGame();G.pw=pw;G.soundOn=snd;document.getElementById('dead-overlay').style.display='none';animCls='idle';save();render();setMsg('idle');clearInterval(ticker);ticker=setInterval(tick,1000);}

function startGame(){
  render();setMsg(G.sleeping?'sleeping':getMood());
  if(!G.alive)document.getElementById('dead-overlay').style.display='flex';
  ticker=setInterval(tick,1000);
  if(G.stage>=1&&!G.name)setTimeout(showNameModal,500);
}

// 시작
document.getElementById('pw-overlay').style.display='flex';
setPwMode(!!localStorage.getItem(SAVE_KEY)?'load':'new');
</script>
</body>
