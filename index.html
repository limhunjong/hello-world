<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐯 호랑이 다마고치</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:linear-gradient(160deg,#FFF5E4 0%,#FFE0A0 50%,#FFCC66 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Jua',cursive;
  overflow-x:hidden;
  padding:12px 0 24px;
}

/* bg paws */
.bg-paw{position:fixed;font-size:40px;opacity:0.07;pointer-events:none;animation:pawFloat 9s ease-in-out infinite}
@keyframes pawFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-18px) rotate(15deg)}}

.game-title{
  font-size:26px;color:#CC4400;letter-spacing:2px;margin-bottom:14px;
  text-shadow:0 3px 0 #FF8833,0 5px 10px rgba(200,80,0,0.25);
}

/* ── DEVICE ── */
.device{
  width:340px;
  background:linear-gradient(165deg,#FF9500 0%,#FF7700 60%,#E05500 100%);
  border-radius:46% 46% 42% 42% / 20% 20% 80% 80%;
  padding:20px 20px 42px;
  box-shadow:
    0 28px 55px rgba(180,80,0,0.4),
    inset 0 3px 0 rgba(255,255,255,0.4),
    inset 0 -4px 10px rgba(0,0,0,0.2),
    0 0 0 5px #BB4400,
    0 0 0 9px #FFA033,
    0 0 0 13px #BB4400;
  position:relative;
}
.device::before{
  content:'';position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  width:16px;height:20px;background:#BB4400;border-radius:50% 50% 0 0;
  box-shadow:inset 0 3px 5px rgba(0,0,0,0.3),0 0 0 3px #FFA033;
}
.device-label{
  text-align:center;color:#AA3300;font-size:11px;letter-spacing:3px;
  margin-bottom:10px;text-shadow:0 1px 0 rgba(255,255,255,0.4);
}

/* ── SCREEN ── */
.screen{
  background:#C8EE88;border-radius:14px;
  border:4px solid #3A7200;
  box-shadow:inset 0 3px 14px rgba(0,0,0,0.3),inset 0 0 0 1px rgba(0,0,0,0.08);
  padding:10px;position:relative;overflow:hidden;min-height:305px;
}
.screen::after{
  content:'';position:absolute;inset:0;border-radius:10px;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.02) 3px,rgba(0,0,0,0.02) 4px);
}

/* info bar */
.info-bar{
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(0,0,0,0.1);border-radius:8px;padding:4px 8px;margin-bottom:8px;
  font-size:12px;color:#1A4400;
}

/* ── TIGER DISPLAY ── */
.tiger-stage{
  height:165px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;position:relative;
}
.tiger-wrap{position:relative;display:inline-block;transition:transform 0.3s}
.tiger-wrap.idle    {animation:idleBob 2.8s ease-in-out infinite}
.tiger-wrap.happy   {animation:happyJump 0.5s ease-in-out infinite}
.tiger-wrap.shaking {animation:shake 0.45s ease-in-out}
.tiger-wrap.sleeping{animation:sleepBreath 4s ease-in-out infinite}
@keyframes idleBob    {0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes happyJump  {0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-11px) scale(1.05)}}
@keyframes shake      {0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes sleepBreath{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

/* floating effects */
.fx{position:absolute;font-size:24px;pointer-events:none;animation:fxUp 1s ease-out forwards}
@keyframes fxUp{0%{transform:translateY(0) scale(0.6);opacity:1}100%{transform:translateY(-75px) scale(1.5);opacity:0}}

/* ── MESSAGE BUBBLE ── */
.msg-bubble{
  background:rgba(255,255,255,0.78);border:2px solid rgba(255,255,255,0.95);
  border-radius:12px;padding:5px 12px;text-align:center;
  font-size:13px;color:#1A4400;min-height:28px;
  margin-top:6px;position:relative;
}
.msg-bubble::before{
  content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-bottom-color:rgba(255,255,255,0.95);
}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.stat{display:flex;align-items:center;gap:4px}
.stat.full{grid-column:span 2}
.stat-icon{font-size:14px;flex-shrink:0;width:20px;text-align:center}
.bar-bg{flex:1;height:11px;background:rgba(0,0,0,0.14);border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,0.07)}
.bar-fill{height:100%;border-radius:6px;transition:width 0.6s ease}
.bar-fill.low{animation:barBlink 0.75s ease-in-out infinite}
@keyframes barBlink{0%,100%{opacity:1}50%{opacity:0.25}}

.b-hunger .bar-fill{background:linear-gradient(90deg,#FF5500,#FF9944)}
.b-happy  .bar-fill{background:linear-gradient(90deg,#FF3388,#FF88BB)}
.b-health .bar-fill{background:linear-gradient(90deg,#00AA77,#55DDAA)}
.b-energy .bar-fill{background:linear-gradient(90deg,#7733EE,#BB77FF)}
.b-clean  .bar-fill{background:linear-gradient(90deg,#0099CC,#44CCEE)}

/* ── DEAD OVERLAY ── */
.dead-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,0.75);border-radius:10px;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  color:white;gap:8px;z-index:10;
}
.restart-btn{
  margin-top:4px;background:#FF5500;border:none;border-radius:22px;
  padding:9px 24px;color:white;font-size:15px;font-family:'Jua',cursive;
  cursor:pointer;box-shadow:0 4px 0 #AA2200;transition:transform 0.1s;
}
.restart-btn:active{transform:translateY(4px);box-shadow:0 0px 0 #AA2200}

/* ── ACTION BUTTONS ── */
.btns{
  display:grid;grid-template-columns:repeat(3,1fr);gap:11px;
  padding:2px 8px 0;margin-top:18px;
}
.btn-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.btn-wrap:active .btn-c{transform:translateY(5px)!important;box-shadow:0 1px 0 rgba(0,0,0,0.25)!important}
.btn-c{
  width:55px;height:55px;border-radius:50%;border:none;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform 0.08s,box-shadow 0.08s;
}
.btn-lbl{font-size:10px;color:#882200}
.b1{background:#FF6644;box-shadow:0 5px 0 #CC3300}
.b2{background:#66DD44;box-shadow:0 5px 0 #339900}
.b3{background:#66AAFF;box-shadow:0 5px 0 #2266CC}
.b4{background:#BB88FF;box-shadow:0 5px 0 #7733BB}
.b5{background:#FF88AA;box-shadow:0 5px 0 #CC3366}
.b6{background:#FFCC00;box-shadow:0 5px 0 #AA8800}

/* ── TOAST ── */
.toast{
  position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-90px);
  background:rgba(255,255,255,0.95);border-radius:22px;padding:10px 22px;
  font-size:13px;color:#333;box-shadow:0 8px 24px rgba(0,0,0,0.18);
  transition:transform 0.36s cubic-bezier(0.34,1.56,0.64,1);z-index:100;
  white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* evolution flash */
.evo-flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:99;transition:opacity 0.7s ease}
</style>
</head>
<body>

<div class="bg-paw" style="top:5%;left:3%;animation-delay:0s">🐾</div>
<div class="bg-paw" style="top:12%;right:4%;animation-delay:1.5s">🐾</div>
<div class="bg-paw" style="bottom:12%;left:4%;animation-delay:3s">🐾</div>
<div class="bg-paw" style="bottom:6%;right:3%;animation-delay:0.8s">🐾</div>
<div class="bg-paw" style="top:50%;left:1%;animation-delay:2.2s;font-size:28px">🐾</div>

<div class="toast" id="toast"></div>
<div class="evo-flash" id="evoFlash"></div>

<div class="game-title">🐯 호랑이 다마고치</div>

<div class="device">
  <div class="device-label">✦ TIGER TAMAGOTCHI ✦</div>

  <div class="screen">
    <div class="info-bar">
      <span id="stage-name">🥚 알</span>
      <span id="age-disp">0일차</span>
      <span id="time-icon">☀️</span>
    </div>

    <div class="tiger-stage" id="tiger-stage"></div>

    <div class="msg-bubble" id="msg-bubble">어서 와! 나 여기 있어~ 🐾</div>

    <div class="stats">
      <div class="stat b-hunger"><span class="stat-icon">🍖</span><div class="bar-bg"><div class="bar-fill" id="b-hunger" style="width:80%"></div></div></div>
      <div class="stat b-happy"> <span class="stat-icon">😊</span><div class="bar-bg"><div class="bar-fill" id="b-happy"  style="width:80%"></div></div></div>
      <div class="stat b-health"><span class="stat-icon">💖</span><div class="bar-bg"><div class="bar-fill" id="b-health" style="width:100%"></div></div></div>
      <div class="stat b-energy"><span class="stat-icon">⚡</span><div class="bar-bg"><div class="bar-fill" id="b-energy" style="width:100%"></div></div></div>
      <div class="stat b-clean full"><span class="stat-icon">🛁</span><div class="bar-bg"><div class="bar-fill" id="b-clean" style="width:100%"></div></div></div>
    </div>

    <div class="dead-overlay" id="dead-overlay">
      <div style="font-size:46px">😢</div>
      <div style="font-size:16px">호랑이가 하늘나라로...</div>
      <div style="font-size:12px;opacity:0.75">더 잘 돌봐줄걸 ㅠㅠ</div>
      <button class="restart-btn" onclick="restartGame()">다시 시작하기 🐯</button>
    </div>
  </div>

  <div class="btns">
    <div class="btn-wrap" onclick="doAction('feed')">
      <div class="btn-c b1">🍖</div><span class="btn-lbl">밥주기</span>
    </div>
    <div class="btn-wrap" onclick="doAction('play')">
      <div class="btn-c b2">🎮</div><span class="btn-lbl">놀아주기</span>
    </div>
    <div class="btn-wrap" onclick="doAction('sleep')">
      <div class="btn-c b3">💤</div><span class="btn-lbl">재우기</span>
    </div>
    <div class="btn-wrap" onclick="doAction('clean')">
      <div class="btn-c b4">🛁</div><span class="btn-lbl">씻기기</span>
    </div>
    <div class="btn-wrap" onclick="doAction('heal')">
      <div class="btn-c b5">💊</div><span class="btn-lbl">약주기</span>
    </div>
    <div class="btn-wrap" onclick="doAction('pet')">
      <div class="btn-c b6">❤️</div><span class="btn-lbl">쓰다듬기</span>
    </div>
  </div>
</div>

<script>
// ── SVG: STICKER-STYLE TIGER ─────────────────────────────────────────────────
// Design reference: chubby, round, thick black outline, bold stripes
// matching the 주환이 sticker character style

function tigerSVG(mood, s) {
  s = s || 1;
  const W  = Math.round(108 * s), H = Math.round(130 * s);
  const OG = '#FF9200';  // tiger orange (warm)
  const ER = '#E07500';  // ear inner / darker
  const BL = '#FFEEDD';  // belly light
  const BK = '#151005';  // outline / stripes
  const ol = `stroke="${BK}" stroke-width="5.5" stroke-linejoin="round"`;

  // ── Per-mood: eyes, mouth, extras ──────────────────────────────────────────
  let eyeL, eyeR, mouth, extra = '';

  if (mood === 'happy') {
    // ^^ eyes (upward arc)
    eyeL  = `<path d="M27,48 Q37,38 47,48" stroke="${BK}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    eyeR  = `<path d="M53,48 Q63,38 73,48" stroke="${BK}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    mouth = `<path d="M36,61 Q50,73 64,61" stroke="${BK}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    extra = `<ellipse cx="23" cy="58" rx="10" ry="7" fill="#FF3366" opacity="0.28"/>
             <ellipse cx="77" cy="58" rx="10" ry="7" fill="#FF3366" opacity="0.28"/>`;

  } else if (mood === 'sleeping') {
    // closed eyes (downward arc like eyelids)
    eyeL  = `<path d="M27,46 Q37,53 47,46" stroke="${BK}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    eyeR  = `<path d="M53,46 Q63,53 73,46" stroke="${BK}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    mouth = `<path d="M41,60 Q50,63 59,60" stroke="${BK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    extra = `<ellipse cx="23" cy="58" rx="9" ry="6" fill="#FF3366" opacity="0.18"/>
             <ellipse cx="77" cy="58" rx="9" ry="6" fill="#FF3366" opacity="0.18"/>
             <text x="70" y="33" font-size="14" fill="${BK}" opacity="0.62" font-family="serif" font-weight="bold">z</text>
             <text x="76" y="21" font-size="10" fill="${BK}" opacity="0.44" font-family="serif" font-weight="bold">z</text>
             <text x="80" y="12" font-size="7"  fill="${BK}" opacity="0.28" font-family="serif" font-weight="bold">z</text>`;

  } else if (mood === 'sad') {
    // inner-corner-raised worried eyes
    eyeL  = `<rect x="28" y="40" width="18" height="9" rx="4.5" fill="${BK}" transform="rotate(14,37,44.5)"/>`;
    eyeR  = `<rect x="54" y="40" width="18" height="9" rx="4.5" fill="${BK}" transform="rotate(-14,63,44.5)"/>`;
    mouth = `<path d="M37,63 Q50,55 63,63" stroke="${BK}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    extra = `<!-- tear left -->
             <path d="M33,52 Q32,60 34,66" stroke="#66AAFF" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.82"/>
             <ellipse cx="34" cy="69" rx="4.5" ry="6" fill="#66AAFF" opacity="0.78"/>
             <ellipse cx="22" cy="58" rx="9" ry="6" fill="#AACCFF" opacity="0.2"/>
             <ellipse cx="78" cy="58" rx="9" ry="6" fill="#AACCFF" opacity="0.2"/>`;

  } else if (mood === 'sick') {
    // × × eyes
    eyeL  = `<line x1="28" y1="39" x2="46" y2="52" stroke="${BK}" stroke-width="6.5" stroke-linecap="round"/>
             <line x1="46" y1="39" x2="28" y2="52" stroke="${BK}" stroke-width="6.5" stroke-linecap="round"/>`;
    eyeR  = `<line x1="54" y1="39" x2="72" y2="52" stroke="${BK}" stroke-width="6.5" stroke-linecap="round"/>
             <line x1="72" y1="39" x2="54" y2="52" stroke="${BK}" stroke-width="6.5" stroke-linecap="round"/>`;
    mouth = `<path d="M38,63 Q50,57 62,63" stroke="${BK}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    extra = `<!-- sweat drop -->
             <path d="M20,43 Q18,52 20,59" stroke="#55BBFF" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
             <ellipse cx="20" cy="63" rx="5" ry="7" fill="#55BBFF" opacity="0.75"/>`;

  } else if (mood === 'hungry') {
    // normal eyes + drool + swirl marks
    eyeL  = `<rect x="28" y="40" width="18" height="9" rx="4.5" fill="${BK}"/>`;
    eyeR  = `<rect x="54" y="40" width="18" height="9" rx="4.5" fill="${BK}"/>`;
    mouth = `<path d="M37,60 Q50,69 63,60" stroke="${BK}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    extra = `<!-- drool -->
             <path d="M48,70 Q47,78 49,85" stroke="#77CCFF" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.85"/>
             <ellipse cx="49" cy="89" rx="6" ry="8" fill="#77CCFF" opacity="0.8"/>
             <!-- hunger marks -->
             <path d="M15,38 Q18,31 22,36" stroke="${BK}" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55"/>
             <path d="M85,38 Q82,31 78,36" stroke="${BK}" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55"/>`;

  } else {
    // idle / neutral — rectangular eyes, light smile
    eyeL  = `<rect x="28" y="40" width="18" height="9" rx="4.5" fill="${BK}"/>`;
    eyeR  = `<rect x="54" y="40" width="18" height="9" rx="4.5" fill="${BK}"/>`;
    mouth = `<path d="M39,60 Q50,67 61,60" stroke="${BK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    extra = `<ellipse cx="22" cy="58" rx="9" ry="6" fill="#FF3366" opacity="0.22"/>
             <ellipse cx="78" cy="58" rx="9" ry="6" fill="#FF3366" opacity="0.22"/>`;
  }

  return `<svg viewBox="0 0 100 127" width="${W}" height="${H}"
          style="overflow:visible;filter:drop-shadow(0 4px 8px rgba(120,60,0,0.28))">

    <!-- TAIL (behind body) -->
    <path d="M76,98 Q93,82 89,64 Q85,50 76,58"
          fill="${ER}" ${ol} stroke-linecap="round"/>

    <!-- LEFT ARM -->
    <ellipse cx="13" cy="85" rx="11" ry="16" fill="${OG}" ${ol}
             transform="rotate(-24 13 85)"/>

    <!-- RIGHT ARM -->
    <ellipse cx="87" cy="85" rx="11" ry="16" fill="${OG}" ${ol}
             transform="rotate(24 87 85)"/>

    <!-- BODY -->
    <ellipse cx="50" cy="96" rx="33" ry="28" fill="${OG}" ${ol}/>

    <!-- BELLY (soft cream circle) -->
    <ellipse cx="50" cy="100" rx="19" ry="17" fill="${BL}" opacity="0.55"/>

    <!-- BODY STRIPES (bold 3 lines) -->
    <path d="M25,78 Q27,91 25,105" stroke="${BK}" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <path d="M50,76 Q50,91 50,105"  stroke="${BK}" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <path d="M75,78 Q73,91 75,105" stroke="${BK}" stroke-width="6.5" fill="none" stroke-linecap="round"/>

    <!-- LEFT FOOT -->
    <ellipse cx="33" cy="120" rx="15" ry="9" fill="${OG}" ${ol}/>
    <!-- RIGHT FOOT -->
    <ellipse cx="67" cy="120" rx="15" ry="9" fill="${OG}" ${ol}/>

    <!-- EARS (behind head layer) -->
    <circle cx="20" cy="15" r="15" fill="${OG}" ${ol}/>
    <circle cx="80" cy="15" r="15" fill="${OG}" ${ol}/>
    <!-- ear inner -->
    <circle cx="20" cy="17" r="9"  fill="${ER}"/>
    <circle cx="80" cy="17" r="9"  fill="${ER}"/>

    <!-- HEAD (large, round, slightly off-center down) -->
    <circle cx="50" cy="48" r="40" fill="${OG}" ${ol}/>

    <!-- HEAD STRIPES (3 bold lines) -->
    <path d="M29,11 Q32,25 30,40" stroke="${BK}" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <path d="M50,6  Q50,21 50,38"  stroke="${BK}" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <path d="M71,11 Q68,25 70,40" stroke="${BK}" stroke-width="6.5" fill="none" stroke-linecap="round"/>

    <!-- EYE WHITES (subtle) -->
    <ellipse cx="37" cy="45" rx="12" ry="12" fill="#FFFCF5" opacity="0.85"/>
    <ellipse cx="63" cy="45" rx="12" ry="12" fill="#FFFCF5" opacity="0.85"/>

    <!-- EYES -->
    ${eyeL}
    ${eyeR}

    <!-- NOSE: two small dots like W shape -->
    <circle cx="44" cy="57" r="3.5" fill="${BK}"/>
    <circle cx="56" cy="57" r="3.5" fill="${BK}"/>

    <!-- MOUTH + MOOD EXTRAS -->
    ${mouth}
    ${extra}
  </svg>`;
}

// ── EGG SVG ──────────────────────────────────────────────────────────────────
function eggSVG(ticks) {
  const BK = '#151005';
  const crack1 = ticks > 8;
  const crack2 = ticks > 16;
  return `<svg viewBox="0 0 80 100" width="90" height="112"
          style="filter:drop-shadow(0 4px 7px rgba(120,60,0,0.22));overflow:visible">
    <defs>
      <radialGradient id="eg" cx="38%" cy="30%">
        <stop offset="0%" stop-color="#FFFDE8"/>
        <stop offset="100%" stop-color="#FFE44A"/>
      </radialGradient>
    </defs>
    <ellipse cx="40" cy="56" rx="33" ry="44"
             fill="url(#eg)" stroke="${BK}" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="28" cy="36" rx="9" ry="14" fill="white" opacity="0.3" transform="rotate(-14 28 36)"/>
    ${crack1 ? `<path d="M24,36 L30,47 L22,56" stroke="${BK}" stroke-width="3" fill="none" stroke-linecap="round"/>` : ''}
    ${crack2 ? `<path d="M50,40 L56,53 L48,62" stroke="${BK}" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M33,62 L39,73 L31,80" stroke="${BK}" stroke-width="2.5" fill="none" stroke-linecap="round"/>` : ''}
    ${ticks > 13 ? `<text x="16" y="64" font-size="28" opacity="0.12">🐯</text>` : ''}
  </svg>`;
}

// ── GAME STATE ────────────────────────────────────────────────────────────────
const STAGES     = ['알', '아기 호랑이', '어린 호랑이', '청소년 호랑이', '어른 호랑이'];
const STAGE_EMJS = ['🥚', '🐯', '🐯', '🐯', '🐯'];
const STAGE_SZ   = [0, 0.67, 0.80, 0.91, 1.0];
// seconds after hatch for each next evolution
const EVO_SECS   = [0, 25, 180, 420, 840];

const MSGS = {
  idle:     ['잘 놀고 있어~ 😊', '오늘도 최고야! 🐾', '같이 있으니 좋아~', '호랑이가 여기 있어!'],
  hungry:   ['배고파... 밥 줘요 🍖', '꼬르륵~ 배가 고파!', '밥 주세요~ ꒰꒡﹃꒡꒱', '배고파 죽겠어요...'],
  sad:      ['외롭다... 놀아줘 😢', '같이 놀아줘~ 🎮', '심심해... ㅠㅠ', '나 좀 봐줘요...'],
  sick:     ['으으 아파요 💊', '머리가 아파...', '약 주세요 ㅠㅠ', '눕고 싶어...'],
  sleeping: ['쿨쿨... 💤', 'Zzz... 꿈꾸는 중~', '자는 거 방해하지 마~', '이제 잘래... 💤'],
  happy:    ['야호~ 너무 좋아! ✨', '움치치 동치치! 🎉', '행복해~ 💕', '같이 있어서 행복해!'],
};

function newGame() {
  return {
    stage:0, age:0, ticks:0,
    hunger:80, happy:80, health:100, energy:100, clean:100,
    alive:true, sleeping:false, saved:Date.now()
  };
}

let G = newGame();
let animCls = 'idle';
let ticker  = null;

// ── LOAD SAVE ─────────────────────────────────────────────────────────────────
;(function() {
  try {
    const d = localStorage.getItem('hrtama_v4');
    if (!d) return;
    const sv = JSON.parse(d);
    G = { ...newGame(), ...sv };
    // apply offline decay (cap at 10 min)
    const elapsed = Math.min(600, Math.floor((Date.now() - (sv.saved || Date.now())) / 1000));
    if (elapsed > 0 && G.alive && !G.sleeping) {
      G.hunger = Math.max(0, G.hunger - elapsed * 0.083);
      G.happy  = Math.max(0, G.happy  - elapsed * 0.056);
      G.energy = Math.max(0, G.energy - elapsed * 0.042);
      G.clean  = Math.max(0, G.clean  - elapsed * 0.037);
      if (G.hunger <= 0)  G.health = Math.max(0, G.health - elapsed * 0.12);
      if (G.clean  < 20)  G.health = Math.max(0, G.health - elapsed * 0.04);
    }
  } catch(e) {}
})();

// ── RENDER ────────────────────────────────────────────────────────────────────
function getMood() {
  if (!G.alive)       return 'sick';
  if (G.sleeping)     return 'sleeping';
  if (G.health < 30)  return 'sick';
  if (G.hunger < 20)  return 'hungry';
  if (G.happy  < 20)  return 'sad';
  if (G.happy > 75 && G.hunger > 55) return 'happy';
  return 'idle';
}

function render() {
  const stage = document.getElementById('tiger-stage');
  const mood  = getMood();
  const ac    = G.sleeping ? 'sleeping' : animCls;

  if (G.stage === 0) {
    stage.innerHTML = `<div class="tiger-wrap idle">${eggSVG(G.ticks)}</div>`;
  } else {
    stage.innerHTML = `<div class="tiger-wrap ${ac}">${tigerSVG(mood, STAGE_SZ[G.stage])}</div>`;
  }

  // stat bars
  for (const [k, v] of Object.entries({hunger:G.hunger,happy:G.happy,health:G.health,energy:G.energy,clean:G.clean})) {
    const el = document.getElementById(`b-${k}`);
    if (!el) continue;
    el.style.width = Math.max(0, Math.min(100, v)) + '%';
    el.classList.toggle('low', v < 22);
  }

  document.getElementById('stage-name').textContent = STAGE_EMJS[G.stage] + ' ' + STAGES[G.stage];
  document.getElementById('age-disp').textContent   = G.age + '일차';
  const hr = new Date().getHours();
  document.getElementById('time-icon').textContent  = (hr >= 7 && hr < 20) ? '☀️' : '🌙';
}

function setMsg(mood, custom) {
  const el = document.getElementById('msg-bubble');
  if (custom) { el.textContent = custom; return; }
  const arr = MSGS[mood] || MSGS.idle;
  el.textContent = arr[Math.floor(Math.random() * arr.length)];
}

function showFX(emojis) {
  const stage = document.getElementById('tiger-stage');
  emojis.forEach((em, i) => setTimeout(() => {
    const d = document.createElement('div');
    d.className = 'fx';
    d.textContent = em;
    d.style.cssText = `left:${12+Math.random()*70}%;top:${25+Math.random()*40}%;position:absolute`;
    stage.appendChild(d);
    setTimeout(() => d.remove(), 1050);
  }, i * 155));
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2700);
}

function setAnim(cls, dur) {
  animCls = cls;
  setTimeout(() => { animCls = 'idle'; render(); }, dur || 950);
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function doAction(a) {
  if (!G.alive) return;
  let msg = '';
  switch(a) {
    case 'feed':
      if (G.sleeping)    { toast('자고 있어서 밥을 못 먹어요 💤'); return; }
      if (G.hunger >= 100) { toast('배가 불러요! 🍖'); return; }
      G.hunger = Math.min(100, G.hunger + 30);
      G.happy  = Math.min(100, G.happy  + 5);
      msg = '냠냠~ 맛있어! 😋'; showFX(['🍖','✨','💕']); setAnim('happy');
      break;
    case 'play':
      if (G.sleeping)   { toast('자고 있어요 💤'); return; }
      if (G.energy < 10) { toast('너무 피곤해서 못 놀아요 ⚡'); return; }
      G.happy  = Math.min(100, G.happy  + 25);
      G.energy = Math.max(0,   G.energy - 15);
      G.hunger = Math.max(0,   G.hunger - 10);
      msg = '움치치 동치치~ 🎉'; showFX(['🎮','⭐','💫','✨']); setAnim('happy');
      break;
    case 'sleep':
      G.sleeping = !G.sleeping;
      msg = G.sleeping ? '이제 잘래... 쿨쿨 💤' : '잘 잤어! 이제 일어났어~ ☀️';
      toast(G.sleeping ? '호랑이가 잠들었어요 💤' : '호랑이가 일어났어요!');
      break;
    case 'clean':
      if (G.clean >= 100) { toast('이미 깨끗해요! 🛁'); return; }
      G.clean = Math.min(100, G.clean + 40);
      G.happy = Math.min(100, G.happy + 8);
      msg = '깨끗해졌다! 상쾌해~ 🛁'; showFX(['🛁','💧','✨','🌟']); setAnim('happy');
      break;
    case 'heal':
      if (G.health >= 100) { toast('건강해요! 💊'); return; }
      G.health = Math.min(100, G.health + 30);
      G.happy  = Math.max(0,   G.happy  - 5);
      msg = '약 먹었어... 쓰지만 나을 거야 💊'; showFX(['💊','💚','✨']); setAnim('shaking', 500);
      break;
    case 'pet':
      if (G.sleeping) { toast('자는 거 방해하지 마세요~ 💤'); return; }
      G.happy = Math.min(100, G.happy + 15);
      msg = '그루~ 기분 좋아! ❤️'; showFX(['❤️','💕','💗','✨']); setAnim('happy');
      break;
  }
  if (msg) setMsg(null, msg);
  save(); render();
}

// ── GAME LOOP ─────────────────────────────────────────────────────────────────
function tick() {
  if (!G.alive) return;
  G.ticks++;

  if (G.sleeping) {
    G.energy = Math.min(100, G.energy + 0.7);
    G.hunger = Math.max(0,   G.hunger - 0.06);
    if (G.energy >= 100) {
      G.sleeping = false;
      setMsg(null, '잘 잤어! 좋은 아침~ ☀️');
      toast('호랑이가 자연스럽게 일어났어요!');
    }
  } else {
    G.hunger = Math.max(0, G.hunger - 0.083);
    G.happy  = Math.max(0, G.happy  - 0.056);
    G.energy = Math.max(0, G.energy - 0.042);
    G.clean  = Math.max(0, G.clean  - 0.037);
    if (G.hunger <= 0)  G.health = Math.max(0, G.health - 0.17);
    if (G.clean  < 15)  G.health = Math.max(0, G.health - 0.05);
    if (G.happy  < 15)  G.health = Math.max(0, G.health - 0.03);
    // slow recovery when well-fed
    if (G.hunger > 55 && G.clean > 50 && G.happy > 45 && G.health < 100)
      G.health = Math.min(100, G.health + 0.06);
    // random illness
    if (G.ticks % 90 === 0 && Math.random() < 0.18) {
      G.health = Math.max(0, G.health - 12);
      toast('앗! 갑자기 아파요! 💊');
      setMsg(null, '으으... 갑자기 아파졌어 💊');
    }
  }

  // age: 1 day = 60 real seconds
  if (G.ticks % 60 === 0) G.age++;

  // egg hatch
  if (G.stage === 0 && G.ticks >= 22) evolve(1);

  // evolution
  const sSinceHatch = G.ticks - 22;
  if (G.stage === 1 && sSinceHatch >= EVO_SECS[2]) evolve(2);
  if (G.stage === 2 && sSinceHatch >= EVO_SECS[3]) evolve(3);
  if (G.stage === 3 && sSinceHatch >= EVO_SECS[4]) evolve(4);

  // death check
  if (G.health <= 0 && G.alive) {
    G.alive = false;
    document.getElementById('dead-overlay').style.display = 'flex';
    setMsg(null, '안녕... 잘 있어... 😢');
    clearInterval(ticker);
  }

  if (G.ticks % 2 === 0)  render();
  if (G.ticks % 25 === 0) setMsg(getMood());
  save();
}

// ── EVOLVE ────────────────────────────────────────────────────────────────────
function evolve(n) {
  if (G.stage >= n) return;
  G.stage = n;
  const fl = document.getElementById('evoFlash');
  fl.style.opacity = '1';
  setTimeout(() => { fl.style.opacity = '0'; }, 130);
  toast('✨ ' + STAGES[n] + '로 성장했어요! ✨');
  setMsg(null, '우와~ ' + STAGES[n] + '가 됐어! ✨🐯');
}

// ── PERSIST ───────────────────────────────────────────────────────────────────
function save() {
  try { localStorage.setItem('hrtama_v4', JSON.stringify({...G, saved:Date.now()})); } catch(e) {}
}

function restartGame() {
  G = newGame();
  document.getElementById('dead-overlay').style.display = 'none';
  animCls = 'idle';
  save(); render(); setMsg('idle');
  clearInterval(ticker);
  ticker = setInterval(tick, 1000);
}

// ── START ─────────────────────────────────────────────────────────────────────
render();
setMsg(G.sleeping ? 'sleeping' : getMood());
if (!G.alive) document.getElementById('dead-overlay').style.display = 'flex';
ticker = setInterval(tick, 1000);
</script>
</body>
</html>
