<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>호랑이 다마고치</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --pink-light:#FFD4E8;--pink-mid:#FFB8D4;--pink-deep:#FF9EC8;
  --lavender:#C8A8E8;--purple:#9B6FD4;--purple-dark:#7040A0;
  --lcd:#D8E460;--lcd-dark:#A8B820;--lcd-text:#2A3000;
  --blue-star:#6BCFEF;--diamond:#A0D8EF;
  --shadow-light:rgba(255,220,235,0.9);--shadow-dark:rgba(190,100,150,0.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#F8D0E8 0%,#E8C0F8 50%,#D0C8F8 100%);
  font-family:'Jua',sans-serif;
}

/* ── DEVICE ── */
.device{
  position:relative;width:290px;
  background:linear-gradient(170deg,#FFD8EE 0%,#FFB8D4 40%,#FFA8C8 70%,#FFBCD4 100%);
  border-radius:48% 48% 45% 45% / 40% 40% 60% 60%;
  box-shadow:
    -14px -14px 30px var(--shadow-light),
    14px 14px 30px var(--shadow-dark),
    inset -3px -3px 8px rgba(255,200,220,0.5),
    inset 3px 3px 8px rgba(255,255,255,0.7);
  padding:22px 18px 28px;
  overflow:hidden;
  user-select:none;
}

/* ── DECORATIONS ── */
.device-deco{
  position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:1;
}

/* ── KEYCHAIN RING ── */
.keychain{
  position:absolute;top:-20px;left:50%;transform:translateX(-50%);
  width:24px;height:24px;border-radius:50%;
  border:5px solid #C890D8;
  box-shadow:-2px -2px 4px rgba(255,240,255,0.8),2px 2px 4px rgba(150,80,180,0.4);
  background:linear-gradient(135deg,#E8C8F8,#C098D8);
  z-index:10;
}

/* ── INNER CONTENT ── */
.device-inner{position:relative;z-index:3;display:flex;flex-direction:column;gap:10px;}

/* ── BRAND ── */
.brand{
  text-align:center;font-size:13px;font-weight:900;
  color:var(--purple-dark);letter-spacing:2px;
  text-shadow:0 1px 2px rgba(255,255,255,0.8);
  margin-bottom:2px;
}

/* ── SCREEN BEZEL ── */
.screen-bezel{
  background:linear-gradient(135deg,#C898E8 0%,#9868C8 30%,#B888E0 60%,#8858B8 100%);
  clip-path:polygon(8% 0,92% 0,100% 8%,100% 92%,92% 100%,8% 100%,0 92%,0 8%);
  padding:9px;
  box-shadow:0 4px 12px rgba(120,60,180,0.4),inset 0 1px 3px rgba(255,255,255,0.3);
}

/* ── LCD SCREEN ── */
.screen{
  position:relative;
  background:var(--lcd);
  border-radius:3px;
  overflow:hidden;
  min-height:200px;
  display:flex;flex-direction:column;
}
.screen::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.05) 3px,rgba(0,0,0,0.05) 4px);
  z-index:20;
}

/* ── ICON BARS ── */
.icon-bar{
  display:flex;justify-content:space-around;align-items:center;
  padding:3px 4px;
  background:rgba(168,184,20,0.25);
  border-bottom:1px solid rgba(100,120,0,0.15);
}
.icon-bar.bottom{border-bottom:none;border-top:1px solid rgba(100,120,0,0.15);}
.icon-item{
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;cursor:pointer;transition:all 0.15s;
  opacity:0.55;
}
.icon-item.active{
  opacity:1;
  background:rgba(168,184,20,0.4);
  box-shadow:0 1px 3px rgba(80,100,0,0.3);
}
.icon-item svg{width:18px;height:18px;}

/* ── TIGER STAGE ── */
.tiger-stage{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:4px 0;min-height:110px;position:relative;
}

/* ── MSG BUBBLE ── */
.msg-bubble{
  text-align:center;font-size:10px;color:var(--lcd-text);
  min-height:16px;padding:0 6px;line-height:1.4;
  font-weight:700;
}

/* ── STATS AREA ── */
.stats-area{padding:2px 6px;}
.stat-row{display:flex;align-items:center;gap:4px;margin-bottom:2px;}
.stat-label{font-size:8px;color:var(--lcd-text);width:16px;opacity:0.8;}
.stat-bar{flex:1;height:5px;background:rgba(0,0,0,0.12);border-radius:3px;overflow:hidden;}
.stat-fill{height:100%;border-radius:3px;transition:width 0.4s ease;}
.stat-fill.hunger{background:linear-gradient(90deg,#E07020,#FF9040);}
.stat-fill.happy{background:linear-gradient(90deg,#D020A0,#FF60C8);}
.stat-fill.health{background:linear-gradient(90deg,#20A040,#60E080);}
.stat-fill.energy{background:linear-gradient(90deg,#2060D0,#60A8FF);}
.stat-fill.clean{background:linear-gradient(90deg,#8020D0,#C060FF);}

/* ── STATUS ROW ── */
.status-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:1px 6px 2px;font-size:8px;color:var(--lcd-text);opacity:0.8;
}

/* ── BUTTONS AREA ── */
.btn-row{
  display:flex;justify-content:space-around;align-items:center;
  padding:4px 20px;
}
.btn-circle{
  width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(145deg,#EED0F8 0%,#C8A0D8 100%);
  box-shadow:
    -4px -4px 10px rgba(255,240,255,0.9),
    4px 4px 10px rgba(170,120,200,0.5),
    inset 0 1px 2px rgba(255,255,255,0.6);
  color:var(--purple-dark);font-size:14px;font-family:'Jua',sans-serif;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.1s;font-weight:900;
}
.btn-circle:active{
  box-shadow:2px 2px 6px rgba(170,120,200,0.6),inset 2px 2px 5px rgba(150,100,180,0.3);
  transform:translateY(1px);
}
.btn-circle.btn-main{
  width:52px;height:52px;
  background:linear-gradient(145deg,#DCA8F8,#A870D8);
  box-shadow:
    -5px -5px 12px rgba(255,220,255,0.9),
    5px 5px 12px rgba(140,80,200,0.5),
    inset 0 1px 2px rgba(255,255,255,0.5);
  font-size:18px;
}
.btn-label{font-size:8px;text-align:center;color:var(--purple-dark);margin-top:2px;opacity:0.8;}
.btn-wrap{display:flex;flex-direction:column;align-items:center;}

/* ── NAME TAG ── */
.name-tag{
  text-align:center;font-size:10px;color:var(--purple-dark);
  font-weight:900;margin-bottom:1px;
}

/* ── OVERLAYS ── */
.overlay{
  position:fixed;inset:0;background:rgba(100,0,60,0.7);
  display:none;align-items:center;justify-content:center;z-index:100;
  backdrop-filter:blur(4px);
}
.overlay.show{display:flex;}
.overlay-box{
  background:linear-gradient(160deg,#FFD8EE,#F0C8E8);
  border-radius:24px;padding:24px 28px;max-width:280px;width:90%;
  text-align:center;
  box-shadow:-6px -6px 14px rgba(255,220,240,0.8),6px 6px 14px rgba(180,80,140,0.4);
}
.overlay-box h2{color:var(--purple-dark);font-size:20px;margin-bottom:8px;}
.overlay-box p{color:#703060;font-size:13px;margin-bottom:14px;line-height:1.5;}
.ov-btn{
  background:linear-gradient(145deg,#DCA8F8,#A870D8);
  border:none;border-radius:50px;padding:10px 24px;
  color:#fff;font-size:14px;font-family:'Jua',sans-serif;
  cursor:pointer;margin:4px;
  box-shadow:0 3px 8px rgba(140,60,200,0.4);
}
.ov-input{
  width:100%;padding:10px;border-radius:12px;border:2px solid var(--lavender);
  background:#FFF0F8;font-family:'Jua',sans-serif;font-size:15px;
  text-align:center;color:var(--purple-dark);margin-bottom:12px;
  outline:none;
}
.ov-input:focus{border-color:var(--purple);}

/* ── MINI-GAME ── */
#mg-overlay{
  position:fixed;inset:0;background:#1A0A2A;
  display:none;flex-direction:column;align-items:center;
  justify-content:flex-start;z-index:200;padding:20px;
}
#mg-overlay.show{display:flex;}
#mg-header{color:#FFD4E8;font-size:16px;margin-bottom:8px;text-align:center;font-family:'Jua',sans-serif;}
#mg-timer{color:#C8A8E8;font-size:13px;margin-bottom:6px;font-family:'Jua',sans-serif;}
#mg-area{
  position:relative;width:300px;height:340px;
  background:linear-gradient(180deg,#2A1040 0%,#1A0828 100%);
  border-radius:16px;border:2px solid #6040A0;overflow:hidden;
}
#mg-score{color:#FFD4E8;font-size:13px;margin-top:8px;font-family:'Jua',sans-serif;}
.food-item{
  position:absolute;font-size:28px;cursor:pointer;
  animation:floatDown 3s linear forwards;
  filter:drop-shadow(0 0 6px rgba(255,200,100,0.6));
}
@keyframes floatDown{from{transform:translateY(-40px);}to{transform:translateY(380px);}}
#mg-close-btn{
  margin-top:10px;padding:10px 28px;
  background:linear-gradient(145deg,#C898E8,#9060C0);
  border:none;border-radius:50px;color:#fff;
  font-family:'Jua',sans-serif;font-size:14px;cursor:pointer;
}

/* ── COLLECTION OVERLAY ── */
#col-overlay{
  position:fixed;inset:0;background:rgba(20,0,40,0.85);
  display:none;align-items:flex-start;justify-content:center;
  z-index:150;overflow-y:auto;padding:20px;
}
#col-overlay.show{display:flex;}
.col-box{
  background:linear-gradient(160deg,#FFD8EE,#EEC8F0);
  border-radius:20px;padding:20px;width:100%;max-width:320px;
  margin:auto;
}
.col-box h2{color:var(--purple-dark);text-align:center;font-size:18px;margin-bottom:12px;}
.col-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.col-card{
  background:rgba(255,255,255,0.5);border-radius:10px;padding:6px 4px;
  text-align:center;border:1px solid rgba(200,150,220,0.4);
}
.col-card .col-icon{font-size:22px;line-height:1;margin-bottom:2px;display:block;}
.col-card .col-name{font-size:7px;color:var(--purple-dark);line-height:1.2;}
.col-card.locked .col-icon{filter:brightness(0);opacity:0.3;}
.col-card.locked .col-name{opacity:0.4;}
.col-close{
  display:block;margin:14px auto 0;padding:9px 24px;
  background:linear-gradient(145deg,#DCA8F8,#A870D8);
  border:none;border-radius:50px;color:#fff;
  font-family:'Jua',sans-serif;font-size:13px;cursor:pointer;
}

/* ── FX EMOJIS ── */
.fx-emoji{
  position:fixed;font-size:22px;pointer-events:none;z-index:300;
  animation:fxFloat 1.2s ease-out forwards;
}
@keyframes fxFloat{
  0%{opacity:1;transform:translateY(0) scale(1);}
  100%{opacity:0;transform:translateY(-80px) scale(1.5);}
}

/* ── SLEEP ZZZ ── */
.zzz{
  position:absolute;top:10px;right:20px;font-size:12px;
  color:var(--lcd-text);animation:zzz 2s infinite;opacity:0;
  display:none;
}
@keyframes zzz{0%,100%{opacity:0;transform:translateY(0);}50%{opacity:1;transform:translateY(-8px);}}

/* ── BATH BUBBLES ── */
#bath-bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.bubble{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.9),rgba(180,200,255,0.3));
  border:1px solid rgba(200,220,255,0.6);
  animation:bubbleUp var(--dur) ease-out forwards;
}
@keyframes bubbleUp{
  0%{transform:translateY(0) scale(1);opacity:0.8;}
  100%{transform:translateY(-160px) scale(0.3);opacity:0;}
}

/* ── EVOLVE FLASH ── */
@keyframes evolveFlash{
  0%,100%{filter:brightness(1);}
  50%{filter:brightness(3) saturate(0);}
}
.evolving{animation:evolveFlash 0.3s 4;}
</style>
</head>

<!-- Keychain ring -->
<div class="keychain"></div>

<div class="device" id="device">

/* ══════════════════════════════════════════
   SOUND SYSTEM
══════════════════════════════════════════ */
const Sound = {
  ctx: null,
  init() {
    if (!this.ctx) try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  },
  play(type) {
    if (!G || !G.soundOn) return;
    this.init();
    if (!this.ctx) return;
    const ac = this.ctx;
    const now = ac.currentTime;
    const osc = (freq, type, start, dur, gain) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine';
      o.connect(g); g.connect(ac.destination);
      o.frequency.value = freq;
      g.gain.setValueAtTime(gain || 0.2, now + start);
      g.gain.linearRampToValueAtTime(0, now + start + dur);
      o.start(now + start);
      o.stop(now + start + dur + 0.01);
    };
    const plays = {
      feed:   () => { osc(523,'sine',0,0.12,0.2); osc(659,'sine',0.1,0.15,0.2); osc(784,'sine',0.2,0.15,0.2); },
      happy:  () => { osc(523,'sine',0,0.1,0.18); osc(659,'sine',0.1,0.1,0.18); osc(784,'sine',0.2,0.15,0.18); },
      sleep:  () => { osc(220,'sine',0,0.5,0.12); osc(196,'sine',0.3,0.4,0.1); },
      clean:  () => { [600,750,900,750,600].forEach((f,i) => osc(f,'sine',i*0.07,0.1,0.1)); },
      heal:   () => { osc(440,'square',0,0.15,0.08); osc(550,'square',0.1,0.15,0.08); },
      evolve: () => { [262,330,392,523,659,784,1047].forEach((f,i) => osc(f,'sine',i*0.09,0.15,0.18)); },
      catch:  () => { osc(880,'sine',0,0.08,0.18); osc(1100,'sine',0.06,0.1,0.18); },
      die:    () => { osc(300,'sawtooth',0,0.6,0.25); osc(180,'sawtooth',0.4,0.8,0.2); },
    };
    if (plays[type]) plays[type]();
  }
};

function eggSVG(ticks) {
  const crack = ticks > 14
    ? `<path d="M42,28 L38,38 L44,43 L40,53" stroke="#A8A070" stroke-width="2" fill="none" stroke-linecap="round"/>`
    : '';
  const shakeAttr = ticks > 9 ? `style="animation:eggShake 0.5s infinite"` : '';
  return `<svg viewBox="0 0 82 100" width="66" height="80" xmlns="http://www.w3.org/2000/svg" ${shakeAttr}>
  <style>@keyframes eggShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) translateX(-1px)}75%{transform:rotate(3deg) translateX(1px)}}</style>
  <ellipse cx="41" cy="93" rx="20" ry="4" fill="rgba(0,0,0,0.1)"/>
  <ellipse cx="41" cy="56" rx="28" ry="36" fill="#FFF8E8" stroke="#C8B880" stroke-width="3"/>
  <ellipse cx="41" cy="56" rx="22" ry="29" fill="none" stroke="#E8D898" stroke-width="1.5" opacity="0.5"/>
  ${crack}
  <ellipse cx="34" cy="44" rx="4" ry="4.5" fill="rgba(255,240,200,0.6)"/>
</svg>`;
}

const SAVE_KEY = 'hrtama_v7';

function newGame() {
  return {
    stage: 0, age: 0, ticks: 0,
    hunger: 80, happy: 80, health: 100, energy: 100, clean: 100,
    intellect: 0, art: 0, justice: 0, tech: 0, money: 0,
    feedLog: { meat: 0, seafood: 0, formula: 0 },
    careMistakes: 0,
    branch: null, careerId: null,
    alive: true, sleeping: false,
    name: '', soundOn: true, coins: 0,
    collection: [], pw: null, saved: Date.now()
  };
}

let G = newGame();
let ticker = null;
let menuIdx = 0;

/* ══════════════════════════════════════════
   SAVE / LOAD
══════════════════════════════════════════ */
function save() {
  G.saved = Date.now();
  localStorage.setItem(SAVE_KEY, JSON.stringify(G));
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    G = Object.assign(newGame(), d);
    if (!G.feedLog) G.feedLog = { meat: 0, seafood: 0, formula: 0 };
    // Apply offline ticks
    const elapsed = Math.floor((Date.now() - G.saved) / 1000);
    const offlineTicks = Math.min(elapsed, 600);
    for (let i = 0; i < offlineTicks; i++) applyTick(true);
  } catch(e) { G = newGame(); }
}

/* ══════════════════════════════════════════
   MOOD
══════════════════════════════════════════ */
function getMood() {
  if (!G.alive) return 'sad';
  if (G.sleeping) return 'sleeping';
  if (G.health < 20) return 'sick';
  if (G.hunger < 20) return 'hungry';
  if (G.happy > 70) return 'happy';
  if (G.happy < 30) return 'sad';
  return 'idle';
}

/* ══════════════════════════════════════════
   RENDER
══════════════════════════════════════════ */
function render() {
  const mood = getMood();
  const svgEl = document.getElementById('tiger-svg');
  if (G.stage === 0) {
    svgEl.innerHTML = eggSVG(G.ticks);
  } else {
    const sizes = [0, 0.65, 0.78, 0.91, 1.0];
    svgEl.innerHTML = tigerSVG(mood, sizes[G.stage] || 1.0, G.stage, G.careerId);
  }

  ['hunger','happy','health','energy','clean'].forEach(s => {
    const el = document.getElementById('bar-' + s);
    if (el) el.style.width = Math.max(0, Math.min(100, G[s])) + '%';
  });

  const stageNames = ['알','아기','어린이','청소년','어른'];
  document.getElementById('status-age').textContent = '나이: ' + G.age;
  document.getElementById('status-stage').textContent = stageNames[G.stage] || '어른';
  document.getElementById('status-sound').textContent = G.soundOn ? '🔊' : '🔇';
  document.getElementById('name-tag').textContent = G.name ? G.name + '의 다마고치' : '호랑이 다마고치';

  const zzz = document.getElementById('zzz');
  zzz.style.display = G.sleeping ? 'block' : 'none';

  for (let i = 0; i < 8; i++) {
    const el = document.getElementById('icon-' + i);
    if (el) el.classList.toggle('active', i === menuIdx);
  }

  document.getElementById('stats-area').style.display = G.stage === 0 ? 'none' : 'block';
}

function setMsg(text) {
  document.getElementById('msg-bubble').textContent = text;
}

function showFX(emojis) {
  const rect = document.getElementById('device').getBoundingClientRect();
  emojis.forEach((em, i) => {
    const d = document.createElement('div');
    d.className = 'fx-emoji';
    d.textContent = em;
    d.style.cssText = `left:${rect.left + 40 + Math.random() * (rect.width - 80)}px;top:${rect.top + 100 + Math.random() * 80}px;animation-delay:${i*0.1}s`;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1500);
  });
}

/* ══════════════════════════════════════════
   EVOLUTION
══════════════════════════════════════════ */
const EVOLVE_TICKS = [0, 22, 200, 450, 900];

function determineBranch() {
  const f = G.feedLog;
  const max = Math.max(f.meat || 0, f.seafood || 0, f.formula || 0);
  if (max === 0) return 'service';
  if ((f.meat || 0) === max) return 'service';
  if ((f.seafood || 0) === max) return 'creative';
  return 'business';
}

function determineCareer() {
  const m = G.careMistakes;
  const s = G;
  // Hidden first
  if (m === 0 && s.intellect >= 40 && s.tech >= 40) return 'astronautchi';
  if (m <= 1 && s.art >= 35 && s.justice >= 35 && (G.feedLog.seafood||0) >= (G.feedLog.meat||0)) return 'ocean_chi';
  if (m === 0 && Math.min(s.intellect, s.art, s.justice, s.tech, s.money) >= 50) return 'legendary_chi';

  const branch = G.branch;
  if (branch === 'service') {
    if (s.art >= 35 && m <= 2) return 'fashion_chi';
    if (s.art >= 25 && m <= 3) return 'film_actorchi';
    if (s.intellect >= 25 && m <= 3) return 'doctorchi';
    if (s.justice >= 25 && m <= 3) return 'policechi';
    return 'firefighterchi';
  }
  if (branch === 'creative') {
    if (s.justice >= 40 && s.intellect >= 30 && m <= 1) return 'judgechi';
    return 'lawyerchi';
  }
  // business
  if (s.tech >= 35 && s.intellect >= 30 && m <= 2) return 'rocket_scichi';
  if (s.money >= 35 && s.intellect >= 25 && m <= 2) return 'investorchi';
  return 'ceo_chi';
}

function evolve(n) {
  G.stage = n;
  Sound.play('evolve');
  const wrap = document.getElementById('tiger-wrap');
  wrap.classList.add('evolving');
  setTimeout(() => wrap.classList.remove('evolving'), 1200);
  showFX(['✨','🌟','💫','⭐','🎉']);

  if (n === 2) {
    G.branch = determineBranch();
    const bn = { service:'서비스직 🍖', creative:'전문직 ⚖️', business:'비즈니스 💼' };
    setMsg(bn[G.branch] + ' 방향으로 성장 중!');
  }
  if (n === 4) {
    G.careerId = determineCareer();
    const career = CareerUniverse.find(c => c.id === G.careerId);
    if (career) {
      if (!G.collection.includes(career.id)) {
        G.collection.push(career.id);
        G.coins += career.hidden ? 100 : 60;
      }
      document.getElementById('career-title').textContent = '🎉 직업 진화!';
      document.getElementById('career-desc').textContent = career.desc;
      document.getElementById('career-icon').textContent = career.emoji;
      document.getElementById('career-overlay').classList.add('show');
    }
  }
  render();
  save();
}

/* ══════════════════════════════════════════
   TICK
══════════════════════════════════════════ */
function applyTick(silent) {
  if (!G.alive || G.stage === 0) return;
  G.ticks++;
  G.age = Math.floor(G.ticks / 10);

  if (G.sleeping) {
    G.energy = Math.min(100, G.energy + 1.5);
    G.hunger = Math.max(0, G.hunger - 0.4);
    G.clean  = Math.max(0, G.clean  - 0.1);
  } else {
    G.hunger = Math.max(0, G.hunger - 0.35);
    G.happy  = Math.max(0, G.happy  - 0.2);
    G.energy = Math.max(0, G.energy - 0.25);
    G.clean  = Math.max(0, G.clean  - 0.15);
  }

  if (G.hunger < 15 || G.clean < 15) {
    G.health = Math.max(0, G.health - 0.5);
    if (!silent) G.careMistakes++;
  } else if (G.health < 100 && G.hunger > 40) {
    G.health = Math.min(100, G.health + 0.08);
  }

  // Passive aptitude growth based on branch
  if (G.stage >= 2) {
    const br = G.branch;
    if (br === 'service')  { G.art     = Math.min(100, G.art     + 0.05); G.justice = Math.min(100, G.justice + 0.04); }
    if (br === 'creative') { G.justice = Math.min(100, G.justice + 0.07); G.intellect = Math.min(100, G.intellect + 0.05); }
    if (br === 'business') { G.money   = Math.min(100, G.money   + 0.07); G.tech    = Math.min(100, G.tech    + 0.06); }
  }
  G.intellect = Math.min(100, G.intellect + 0.02);

  if (G.health <= 0) {
    G.alive = false;
    if (!silent) {
      Sound.play('die');
      document.getElementById('gameover-msg').textContent = G.name
        ? `${G.name}이(가) 무지개 다리를 건넜어요...`
        : '호랑이가 무지개 다리를 건넜어요...';
      document.getElementById('gameover-overlay').classList.add('show');
    }
    return;
  }

  if (!silent) {
    if (G.stage === 1 && G.ticks >= EVOLVE_TICKS[1]) evolve(2);
    else if (G.stage === 2 && G.ticks >= EVOLVE_TICKS[2]) evolve(3);
    else if (G.stage === 3 && G.ticks >= EVOLVE_TICKS[3]) evolve(4);
  }
}

function tick() {
  if (!G.alive) return;

  if (G.stage === 0) {
    G.ticks++;
    if (G.ticks >= 20) {
      G.stage = 1;
      G.ticks = 0;
      Sound.play('evolve');
      showFX(['🐣','✨','💛','🐯']);
      if (!G.name) showNameModal();
    }
    render();
    save();
    return;
  }

  applyTick(false);

  if (G.ticks % 30 === 0) {
    const pools = {
      idle:     ['심심해요~', '놀아주세요!', '배고프지 않아요~', '좋아요~'],
      happy:    ['너무 행복해요! 💛', '최고예요~', '같이 놀아요!', '기분 최고!'],
      sad:      ['슬퍼요...😢', '더 돌봐주세요...', '외로워요...'],
      hungry:   ['배고파요!! 🍖', '밥 주세요!', '꼬르륵...'],
      sleeping: ['z z z...', '냐...', '꿈꾸는 중...'],
      sick:     ['아파요...💊', '약 주세요...', '으으...'],
    };
    const mood = getMood();
    const pool = pools[mood] || pools.idle;
    setMsg(pool[Math.floor(Math.random() * pool.length)]);
  }

  render();
  if (G.ticks % 10 === 0) save();
}

/* ══════════════════════════════════════════
   MENU & BUTTONS
══════════════════════════════════════════ */
function selectMenu(idx) {
  menuIdx = idx;
  render();
  const labels = ['밥주기','미니게임','재우기','씻기기','옷장','약주기','쓰다듬기','도감'];
  setMsg(labels[idx] + ' 선택됨 — ✓ 버튼으로 실행');
}

function btnA() {
  menuIdx = (menuIdx + 1) % 8;
  selectMenu(menuIdx);
}

function btnB() {
  if (G.stage === 0) return;
  Sound.init();
  const actions = [
    () => {
      if (!G.alive) return;
      if (G.sleeping) { setMsg('자는 중이에요! 💤'); return; }
      document.getElementById('feed-overlay').classList.add('show');
    },
    () => {
      if (!G.alive) return;
      if (G.energy < 10) { setMsg('너무 피곤해요!'); return; }
      startMG();
    },
    () => { if (!G.alive) return; toggleSleep(); },
    () => { if (!G.alive) return; doBath(); },
    () => { setMsg('옷장 기능 준비 중...'); },
    () => { if (!G.alive) return; doHeal(); },
    () => {
      if (!G.alive) return;
      if (G.sleeping) { setMsg('자는 중이에요!'); return; }
      doPet();
    },
    () => { showCollection(); },
  ];
  if (actions[menuIdx]) actions[menuIdx]();
}

function btnC() {
  document.getElementById('feed-overlay').classList.remove('show');
  document.getElementById('career-overlay').classList.remove('show');
}

/* ══════════════════════════════════════════
   FEED
══════════════════════════════════════════ */
function doFeed(type) {
  document.getElementById('feed-overlay').classList.remove('show');
  G.hunger = Math.min(100, G.hunger + 30);
  G.happy  = Math.min(100, G.happy  + 5);
  G.feedLog[type] = (G.feedLog[type] || 0) + 1;
  if (type === 'meat')    { G.art     = Math.min(100, G.art     + 2); G.justice  = Math.min(100, G.justice  + 1); }
  if (type === 'seafood') { G.justice = Math.min(100, G.justice + 2); G.intellect = Math.min(100, G.intellect + 2); }
  if (type === 'formula') { G.money   = Math.min(100, G.money   + 2); G.tech     = Math.min(100, G.tech     + 2); G.intellect = Math.min(100, G.intellect + 1); }
  Sound.play('feed');
  showFX(['🍖','😋','💛']);
  setMsg('냠냠~ 맛있어요!');
  render(); save();
}

function closeFeedOverlay() {
  document.getElementById('feed-overlay').classList.remove('show');
}

/* ══════════════════════════════════════════
   OTHER ACTIONS
══════════════════════════════════════════ */
function toggleSleep() {
  G.sleeping = !G.sleeping;
  Sound.play('sleep');
  setMsg(G.sleeping ? '좋은 꿈 꿔요~ 💤' : '잘 잤어요! ☀️');
  showFX(G.sleeping ? ['💤','🌙','⭐'] : ['☀️','✨','😊']);
  render(); save();
}

function doBath() {
  G.clean = Math.min(100, G.clean + 40);
  G.happy = Math.min(100, G.happy + 8);
  Sound.play('clean');
  showFX(['🫧','💦','✨']);
  setMsg('깨끗해졌어요! 🛁');
  spawnBubbles();
  render(); save();
}

function doHeal() {
  G.health = Math.min(100, G.health + 30);
  G.happy  = Math.max(0, G.happy - 5);
  Sound.play('heal');
  showFX(['💊','❤️‍🩹']);
  setMsg('쓴 약이지만 건강해져요!');
  render(); save();
}

function doPet() {
  G.happy     = Math.min(100, G.happy + 15);
  G.intellect = Math.min(100, G.intellect + 0.5);
  Sound.play('happy');
  showFX(['❤️','💛','💜']);
  setMsg('쓰다듬어줘서 고마워요! 🐯');
  render(); save();
}

function toggleSound() {
  G.soundOn = !G.soundOn;
  save(); render();
}

function spawnBubbles() {
  const container = document.getElementById('bath-bubbles');
  for (let i = 0; i < 12; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 5 + Math.random() * 13;
    const dur  = 0.7 + Math.random() * 0.9;
    b.style.cssText = `width:${size}px;height:${size}px;left:${5+Math.random()*65}px;bottom:${5+Math.random()*35}px;--dur:${dur}s;animation-delay:${Math.random()*0.6}s`;
    container.appendChild(b);
    setTimeout(() => b.remove(), (dur + 0.7) * 1000);
  }
}

/* ══════════════════════════════════════════
   NAME MODAL
══════════════════════════════════════════ */
function showNameModal() {
  document.getElementById('name-overlay').classList.add('show');
  setTimeout(() => document.getElementById('name-input').focus(), 150);
}

function confirmName() {
  const v = document.getElementById('name-input').value.trim();
  if (!v) return;
  G.name = v;
  document.getElementById('name-overlay').classList.remove('show');
  setMsg(`안녕! 나는 ${v}이야! 🐯`);
  showFX(['🐯','💛','✨']);
  render(); save();
}

document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmName();
});

/* ══════════════════════════════════════════
   CAREER
══════════════════════════════════════════ */
function closeCareerOverlay() {
  document.getElementById('career-overlay').classList.remove('show');
}

/* ══════════════════════════════════════════
   COLLECTION
══════════════════════════════════════════ */
function showCollection() {
  const grid = document.getElementById('col-grid');
  grid.innerHTML = '';
  const visible = CareerUniverse.filter(c => !c.hidden || G.collection.includes(c.id));
  visible.forEach(c => {
    const unlocked = G.collection.includes(c.id);
    const card = document.createElement('div');
    card.className = 'col-card' + (unlocked ? '' : ' locked');
    card.innerHTML = `<span class="col-icon">${c.emoji}</span><div class="col-name">${unlocked ? c.nameKo : '???'}</div>`;
    if (unlocked) card.title = c.desc;
    grid.appendChild(card);
  });
  document.getElementById('col-overlay').classList.add('show');
}

function closeCollection() {
  document.getElementById('col-overlay').classList.remove('show');
}

/* ══════════════════════════════════════════
   MINI GAME
══════════════════════════════════════════ */
let mgScore = 0, mgTimeLeft = 0, mgInterval = null, mgSpawnInterval = null;
const FOOD_ITEMS = ['🍖','🐟','🍗','🍣','🥩','🦴','🐠','🥚','🍱','🧀','🥕','🌽'];

function startMG() {
  mgScore = 0;
  mgTimeLeft = 15;
  document.getElementById('mg-score').textContent = '점수: 0';
  document.getElementById('mg-timer').textContent = '남은 시간: 15초';
  document.getElementById('mg-area').innerHTML = '';
  document.getElementById('mg-close-btn').style.display = 'none';
  document.getElementById('mg-overlay').classList.add('show');
  G.energy = Math.max(0, G.energy - 15);
  G.hunger = Math.max(0, G.hunger - 10);

  mgSpawnInterval = setInterval(spawnFood, 750);
  mgInterval = setInterval(() => {
    mgTimeLeft--;
    document.getElementById('mg-timer').textContent = `남은 시간: ${mgTimeLeft}초`;
    if (mgTimeLeft <= 0) endMG();
  }, 1000);
}

function spawnFood() {
  const area = document.getElementById('mg-area');
  const item = document.createElement('div');
  item.className = 'food-item';
  item.textContent = FOOD_ITEMS[Math.floor(Math.random() * FOOD_ITEMS.length)];
  item.style.left = (8 + Math.random() * 250) + 'px';
  item.style.animationDuration = (1.8 + Math.random() * 1.4) + 's';
  item.addEventListener('click', () => {
    mgScore++;
    document.getElementById('mg-score').textContent = '점수: ' + mgScore;
    Sound.play('catch');
    item.remove();
  });
  area.appendChild(item);
  setTimeout(() => { if (item.parentNode) item.remove(); }, 3500);
}

function endMG() {
  clearInterval(mgInterval);
  clearInterval(mgSpawnInterval);
  document.getElementById('mg-area').innerHTML = '';
  const bonus = Math.min(45, mgScore * 3);
  G.happy = Math.min(100, G.happy + bonus);
  G.art   = Math.min(100, G.art   + mgScore * 0.3);
  document.getElementById('mg-score').textContent = `완료! 점수: ${mgScore} → 행복 +${bonus}`;
  document.getElementById('mg-timer').textContent = '게임 끝!';
  document.getElementById('mg-close-btn').style.display = 'block';
  Sound.play('happy');
  save();
}

function closeMG() {
  clearInterval(mgInterval);
  clearInterval(mgSpawnInterval);
  document.getElementById('mg-overlay').classList.remove('show');
  render();
}

/* ══════════════════════════════════════════
   RESTART
══════════════════════════════════════════ */
function restartGame() {
  const { name, soundOn, pw, collection } = G;
  G = newGame();
  G.name = name; G.soundOn = soundOn; G.pw = pw; G.collection = collection;
  document.getElementById('gameover-overlay').classList.remove('show');
  render(); save();
}

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
load();
render();
setMsg(G.stage === 0
  ? '알이 흔들리고 있어요...'
  : (G.name ? `안녕! ${G.name}이야! 🐯` : '안녕하세요! 🐯'));
ticker = setInterval(tick, 1000);
</script>
